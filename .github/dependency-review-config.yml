# Spec 0009 DEP-8 (core), spec 0008 CI-3, spec 0006 SUP-2.
# allow-licenses is the gate: spec 0009 DEP-1's Permissive list plus MPL-2.0 (core only, used unmodified, DEP-3).
# allow-dependencies-licenses exempts the named dev exceptions in spec 0009 DEP-5's table, by package URL without a
# version. Add or remove one only with that table, in the same PR.
fail-on-severity: moderate
# The action checks only runtime dependencies by default, so a dev dependency (DEP-5) would skip the license gate.
fail-on-scopes:
  - runtime
  - development
  - unknown
allow-licenses:
  - MIT
  - MIT-0
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Zlib
  - PostgreSQL
  - BlueOak-1.0.0
  - Unlicense
  - CC0-1.0
  - MPL-2.0
allow-dependencies-licenses:
  - pkg:npm/caniuse-lite
  - pkg:nuget/Microsoft.Testing.Extensions.CodeCoverage
