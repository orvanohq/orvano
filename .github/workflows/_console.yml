# Spec 0008 CI-2: the React console. Called by ci.yml when console/**, the lint fixtures, or a global path changed.
name: Console

on:
  workflow_call:

permissions: {}

jobs:
  console:
    name: console
    runs-on: ubuntu-24.04
    # Room for the browser install's retries on a slow apt mirror (at most 20 minutes) on top of the usual run.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node from .node-version; Vite+ from the root package.json; pnpm from its packageManager field.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: pnpm install --frozen-lockfile
      # vp check, ESLint, tsc, and the drift checks (catalogs, route tree). The drift check's build feeds the size check.
      - run: pnpm check:js
      - run: pnpm check:lint-fixtures
      # The tooling scripts' own tests (changes, fixtures, format-cs, size entries, coverage summary).
      - run: pnpm test:tooling
      - name: SDK generator tests (spec 0014 GNR-10)
        run: pnpm test:generator
      # The Dart snapshots must pass the Dart SDK repos' analyzer, on their SDK floor (spec 0004 DRT-1, DRT-4), and the
      # shared Dart runtime its unit tests (DQA-5).
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.10.0
      - name: Dart SDK generator output (spec 0014 AC-14)
        run: pnpm test:generator:dart
      # The C# snapshot must build with sdk-dotnet's compiler settings and be clean under its dotnet format
      # (spec 0002 LIB-11, spec 0014 GNR-9).
      # Outage workaround for setup-dotnet (aka.ms answers 409); remove with the action once aka.ms works again.
      - uses: ./.github/actions/install-dotnet
        with:
          global-json-file: server/global.json
      - name: C# SDK generator output (spec 0014 AC-14)
        run: pnpm test:generator:csharp
      - id: playwright
        name: Find the Playwright version
        run: echo "version=$(pnpm --filter @orvano/console exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser (CI-7)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-3-engines
      # The browsers' system packages (about 140 for WebKit and Firefox), kept between runs so a slow apt mirror can't
      # stall the job: apt installs them from these files and downloads only what changed.
      - name: Cache the Playwright system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-3-engines
      # Spec 0003 QA-1: src/ui primitives run in Chromium, Firefox, and WebKit. The Azure apt mirror sometimes slows to
      # a few KB/s, so each attempt gets 6 minutes, and a retry switches to the main Ubuntu mirror.
      - name: Install the browsers and their system packages
        timeout-minutes: 20
        run: |
          set -euo pipefail
          debs="$HOME/.cache/playwright-apt"
          mkdir -p "$debs"
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded > /dev/null
          if compgen -G "$debs/*.deb" > /dev/null; then sudo cp "$debs"/*.deb /var/cache/apt/archives/; fi
          for attempt in 1 2 3; do
            if timeout 6m pnpm --filter @orvano/console exec playwright install --with-deps chromium firefox webkit; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::Installing the browsers timed out or failed (attempt $attempt); retrying on archive.ubuntu.com."
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2> /dev/null || true
          done
          cp /var/cache/apt/archives/*.deb "$debs"/ 2> /dev/null || true
      # V8 coverage works only in Chromium, so Firefox and WebKit run the src/ui tests in a second step.
      - name: Tests (Vitest browser mode, Chromium) with coverage
        run: pnpm --filter @orvano/console test:coverage
      - name: src/ui tests in Firefox and WebKit (spec 0003 QA-1)
        run: pnpm --filter @orvano/console test:engines
      # The steps below use the build that check-drift.mjs made in pnpm check:js.
      - id: size
        name: Bundle and CSS size (spec 0003 BDL-1, spec 0015 STY-4)
        run: pnpm --filter @orvano/console size
      # Spec 0015 AC-3: the ten largest modules of the shell's first load, which the size step prints and saves, also
      # when a budget fails.
      - name: Upload the shell's largest modules
        if: ${{ !cancelled() && steps.size.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-largest-modules
          path: console/dist-size-probe/shell-largest-modules.txt
          if-no-files-found: error
          retention-days: 14
      - name: The gallery is not in the build (spec 0015 GAL-3)
        run: node tooling/scripts/check-gallery-not-shipped.mjs
      - name: CSP and theme boot against the build (spec 0015 STY-6)
        run: pnpm --filter @orvano/console e2e
      - name: Audit dependencies (spec 0006 SUP-5)
        run: pnpm audit --audit-level moderate
      - name: Coverage summary
        if: always()
        run: node tooling/scripts/coverage-summary.mjs

  # Spec 0003 QA-5: Playwright E2E against a real server joins here with the first API screen.
  # e2e:
  #   name: e2e
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 30
  #   permissions:
  #     contents: read
  #   steps: []
