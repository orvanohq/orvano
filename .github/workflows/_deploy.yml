# Spec 0008 CI-2: the image and compose files. Called by ci.yml when a path in changes.mjs's deploy area or a global
# path changed.
name: Deploy

on:
  workflow_call:

permissions: {}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile
      # compose.yaml needs the values `orvano init` writes to deploy/.env; placeholders are enough to validate it.
      - name: Validate the compose files
        env:
          ORVANO_VERSION: ci-placeholder
          ORVANO_DB_PASSWORD: ci-placeholder
          ORVANO_DOMAIN: orvano.example
          ORVANO_PROVISIONER_PASSWORD: ci-placeholder
          ORVANO_PUBLIC_URL: https://orvano.example
          POSTGRES_PASSWORD: ci-placeholder
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.dev.yaml config --quiet
      - name: The Dockerfile's node tag matches .node-version (TL-7)
        run: |
          want="$(tr -d '[:space:]' < .node-version)"
          have="$(sed -nE 's/^FROM .*node:([0-9.]+)-.*/\1/p' deploy/Dockerfile)"
          if [ "$want" != "$have" ]; then
            echo "::error file=deploy/Dockerfile::node tag is $have, but .node-version is $want"
            exit 1
          fi
      - name: Build the image (linux/amd64, no push)
        run: docker buildx build --platform linux/amd64 -f deploy/Dockerfile -t orvano:ci .

  # Spec 0016 SMK-1 to SMK-5: install.sh on a clean runner, on both CPUs and on rootless Podman, from the image this pull
  # request builds, with SMK-3's checks in install-smoke.sh and SMK-4's in install-permissions.sh.
  install:
    name: install (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64 docker
            runner: ubuntu-24.04
            engine: docker
          - name: arm64 docker
            runner: ubuntu-24.04-arm
            engine: docker
          - name: amd64 rootless podman
            runner: ubuntu-24.04
            engine: podman
    env:
      ENGINE: ${{ matrix.engine }}
      # SMK-4: under /tmp, not $RUNNER_TEMP, so another user can reach the folder and only its own 0700 mode stops them.
      INSTALL_DIR: /tmp/orvano-install/orvano
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SMK-5, ISH-1: POSIX sh, checked by shellcheck (preinstalled on the runner image). The same on every leg.
      - name: shellcheck
        if: matrix.name == 'amd64 docker'
        run: shellcheck deploy/install.sh deploy/postgres-init/*.sh tooling/scripts/install-*.sh
      # TEL-1: comments show the one line install and messages print links, but no line may run a download tool.
      - name: install.sh calls no URL
        if: matrix.name == 'amd64 docker'
        run: |
          if grep -nE '\b(curl|wget|fetch)\b|/dev/(tcp|udp)/' deploy/install.sh | grep -vE '^[0-9]+:[[:space:]]*#'; then
            echo "::error file=deploy/install.sh::install.sh must not call a URL (spec 0016 TEL-1)"
            exit 1
          fi
      # SMK-2: built natively for the runner's CPU, never pulled from a registry.
      - name: Build the image
        run: docker build -f deploy/Dockerfile --build-arg ORVANO_IMAGE_VERSION=ci -t orvano:ci .
      # SMK-2: Docker Compose (preinstalled) is Podman's provider, through the user's socket. Podman stores the loaded
      # image as docker.io/library/orvano:ci, and the socket, which is what compose asks, finds it as orvano:ci.
      - name: Set up rootless Podman
        if: matrix.engine == 'podman'
        run: |
          systemctl --user start podman.socket
          podman compose version
          docker save orvano:ci | podman load
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          curl -fsS -o /dev/null --unix-socket "$XDG_RUNTIME_DIR/podman/podman.sock" http://d/images/orvano:ci/json
      # SMK-5 and the script refusals, plus the server profile's bundle (AC-2).
      - name: Refusals and a server mode bundle
        run: sh tooling/scripts/install-checks.sh
      - name: Install and check (SMK-3)
        run: |
          mkdir -p "$(dirname "$INSTALL_DIR")"
          sh tooling/scripts/install-smoke.sh "$INSTALL_DIR"
      - name: Install folder permissions (SMK-4)
        run: sh tooling/scripts/install-permissions.sh "$INSTALL_DIR"
      # ISH-8: the one install per host refusal's fix, on each engine, from a folder with no compose file.
      - name: Remove the install with no folder (ISH-8)
        run: |
          cd "$RUNNER_TEMP"
          "$ENGINE" compose -p orvano down -v
          test -z "$("$ENGINE" volume ls -q --filter label=com.docker.compose.project=orvano)"
      - name: Collect compose logs
        if: failure()
        run: |
          if [ -f "$INSTALL_DIR/compose.yaml" ]; then
            (cd "$INSTALL_DIR" && "$ENGINE" compose logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1) || true
          fi
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-compose-logs-${{ matrix.engine }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/compose.log
          if-no-files-found: ignore
