# Build, lint, format check and test on every push and pull request (AGENTS.md, Tooling),
# plus both container images and the Compose smoke test (spec 0002).
# The repo only allows actions pinned to a full commit SHA; the version is in the comment.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Orvano.slnx
      - name: Check formatting and analyzers
        run: dotnet format Orvano.slnx --no-restore --verify-no-changes
      - name: Build (warnings are errors)
        run: dotnet build Orvano.slnx --no-restore -c Release
      - name: Test
        run: dotnet test --solution Orvano.slnx --no-build -c Release

  web:
    name: Console and docs lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm exec prettier --check console website
      # The console lint also checks tokens.css against tokens.json and fails on raw colours (spec 0003, AC-5).
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  console-e2e:
    name: Console Playwright and axe tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the console
        run: pnpm --filter @orvano/console build
      - name: Install Chromium
        run: pnpm --filter @orvano/console exec playwright install --with-deps chromium
      # Serves console/out at /console with the host's rules (scripts/serve-export.mjs), spec 0003.
      - name: Run Playwright and axe
        run: pnpm --filter @orvano/console test:e2e
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: console/playwright-report/
          retention-days: 7

  images:
    name: Image ${{ matrix.image }} (amd64 and arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [orvano, orvano-executor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The default driver cannot build several platforms. No QEMU: the final stage has no RUN step.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=0.1.0-dev
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Starts the whole stack through Caddy over HTTPS. Prints every container log when it fails.
      - name: Run deploy/smoke-test.sh
        run: deploy/smoke-test.sh
