name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build and EF drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Orvano.slnx -c Release
      - name: Start an empty Postgres 18
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=ci -e ORVANO_ADMIN_PASSWORD=ci-admin -e ORVANO_APP_PASSWORD=ci-app \
            -v "$PWD/deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro" \
            postgres:18.6
          for i in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U orvano_admin -d orvano -q && exit 0
            sleep 1
          done
          docker logs pg; exit 1
      - name: EF model drift check
        run: dotnet run --project server/tests/Orvano.ModelDriftCheck -c Release --no-build
        env:
          ORVANO_DB_ADMIN_URL: Host=localhost;Port=5432;Username=orvano_admin;Password=ci-admin;Database=orvano

  console:
    name: JS workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  compose:
    name: Images and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write a throwaway .env
        run: |
          {
            echo "ORVANO_PUBLIC_URL=http://localhost"
            for v in POSTGRES_PASSWORD ORVANO_ADMIN_PASSWORD ORVANO_APP_PASSWORD; do
              echo "$v=$(openssl rand -hex 24)"
            done
          } > deploy/compose/.env
      # The chiseled-extra image must connect to Postgres over Npgsql and resolve a named time
      # zone; the roles refuse to start otherwise, so healthy containers prove both.
      - run: docker compose -f deploy/compose/docker-compose.yml up -d --build
      - name: GET /v1/health through Caddy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/v1/health; then
              test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/internal/readyz)" = 404
              exit 0
            fi
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs
      - if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
