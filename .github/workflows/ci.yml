name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas this pull request touches (.github/scripts/changed-areas.sh), so each job below runs
  # only when its inputs changed. Pushes to main and manual runs run every job. "CI passed" at the
  # end is the one check to require on main: it passes when every job either passed or was skipped.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.areas.outputs.lint }}
      dotnet: ${{ steps.areas.outputs.dotnet }}
      js: ${{ steps.areas.outputs.js }}
      console: ${{ steps.areas.outputs.console }}
      e2e: ${{ steps.areas.outputs.e2e }}
      install: ${{ steps.areas.outputs.install }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - id: areas
        run: |
          .github/scripts/changed-areas.sh HEAD^1 HEAD <<'RULES'
          all       .github/workflows/ci.yml .github/scripts/changed-areas.sh
          # Prose, including the AGENTS.md and CLAUDE.md files inside code folders.
          ignore    *.md
          # What ESLint and Prettier check: every file outside their ignore lists (Prettier also
          # checks YAML and JSON, so this is wider than the JS workspaces).
          lint      !docs/* !.claude/* !server/* !dev/* !deploy/*
          # Everything Orvano.slnx builds and tests (SdkGen's tests read the SDK manifests).
          dotnet    server/* tools/* dev/* sdks/dotnet/* tests/scenarios/runners/dotnet/* sdks/*/package.json sdks/*/pubspec.yaml tests/scenarios/runners/*/pubspec.yaml contract/dist/openapi.json deploy/compose/initdb/* Orvano.slnx global.json Directory.Build.props Directory.Packages.props .editorconfig VERSION
          js        contract/* console/* sdks/js/* sdks/nextjs/* sdks/console-client/* tests/scenarios/runners/js/* tests/scenarios/runners/nextjs/* package.json pnpm-lock.yaml pnpm-workspace.yaml eslint.config.js .prettierrc.json .tool-versions
          # The frame page's hash test reads its headers file in the gateway folder (spec 0009, AC-32).
          console   console/* sdks/js/* sdks/console-client/* deploy/gateway/email-preview-headers.caddy package.json pnpm-lock.yaml pnpm-workspace.yaml .tool-versions
          # The console against the real API: the console, the gateway, and the server image.
          e2e       console/* sdks/js/* sdks/console-client/* deploy/gateway/* deploy/server.Dockerfile deploy/compose/* server/* contract/dist/openapi.json tests/scenarios/compose.yml tests/scenarios/fixtures.yaml package.json pnpm-lock.yaml pnpm-workspace.yaml global.json Directory.Build.props Directory.Packages.props .dockerignore .tool-versions VERSION
          # The self host install path: the installer, both images, and the Compose file.
          install   deploy/* server/* contract/dist/openapi.json global.json Directory.Build.props Directory.Packages.props .dockerignore VERSION
          RULES

  lint:
    name: Lint and format
    needs: changes
    if: needs.changes.outputs.lint == 'true' || needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      # Style and analyzer rules from .editorconfig; analyzer errors also fail the server build.
      - if: needs.changes.outputs.dotnet == 'true'
        run: dotnet format Orvano.slnx --verify-no-changes
      - if: needs.changes.outputs.lint == 'true'
        run: pnpm install --frozen-lockfile
      # Type aware lint rules need the types of workspace packages, which live in their dist/.
      - if: needs.changes.outputs.lint == 'true'
        run: pnpm --filter "@orvano/scenarios-nextjs^..." build
      # The website's `astro:` modules get their types from .astro/, which `astro sync` writes.
      - if: needs.changes.outputs.lint == 'true'
        run: pnpm --filter @orvano/website exec astro sync
        env:
          ORVANO_SITE_ENV: preview
      - if: needs.changes.outputs.lint == 'true'
        run: pnpm lint
      - if: needs.changes.outputs.lint == 'true'
        run: pnpm format:check

  server:
    name: Server build, tests, and EF drift check
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Orvano.slnx -c Release
      # Testcontainers starts its own Postgres 18 from deploy/compose/initdb, so this needs only Docker.
      - run: dotnet test --solution Orvano.slnx -c Release --no-build
      - name: Start an empty Postgres 18
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=ci -e ORVANO_ADMIN_PASSWORD=ci-admin -e ORVANO_APP_PASSWORD=ci-app \
            -v "$PWD/deploy/compose/initdb:/docker-entrypoint-initdb.d:ro" \
            postgres:18.6
          for i in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U orvano_admin -d orvano -q && exit 0
            sleep 1
          done
          docker logs pg; exit 1
      - name: EF model drift check
        run: dotnet run --project server/tests/Orvano.ModelDriftCheck -c Release --no-build
        env:
          ORVANO_DB_ADMIN_URL: Host=localhost;Port=5432;Username=orvano_admin;Password=ci-admin;Database=orvano

  console:
    name: JS workspace build
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      # The website builds in website.yml, with its own checks.
      - run: pnpm -r --filter "!@orvano/website" build

  console-tests:
    name: Console tests (unit and browser)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      # The console imports the private console client, which builds on the JS runtime.
      - run: pnpm --filter "@orvano/console^..." build
      - run: pnpm --filter @orvano/console exec playwright install --with-deps chromium
      # Contrast, color literal, keyboard script, axe, density, and role tests (spec 0005).
      - run: pnpm --filter @orvano/console test

  console-e2e:
    name: Console end to end (gateway, real API)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orvano/console exec playwright install --with-deps chromium
      # The gateway (Caddy plus the console build) in front of the scenario server, on :8081.
      - run: docker compose -f tests/scenarios/compose.yml --profile console up -d --build --wait
      - run: pnpm --filter @orvano/console test:e2e
      - if: failure()
        run: docker compose -f tests/scenarios/compose.yml --profile console logs
      - if: always()
        run: docker compose -f tests/scenarios/compose.yml --profile console down -v

  install:
    # The real install path, twice, on both architectures (spec 0006, AC-30): images built from this
    # commit and tagged from VERSION, then install.sh with --no-pull, as on an air gapped server.
    name: Install with install.sh (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq shellcheck; }
          shellcheck --shell=sh deploy/install/install.sh
      - name: Build the images
        run: |
          V=$(cat VERSION)
          echo "V=$V" >> "$GITHUB_ENV"
          docker build -f deploy/server.Dockerfile -t "ghcr.io/orvanohq/orvano:$V" .
          docker build -f deploy/gateway/Dockerfile -t "ghcr.io/orvanohq/orvano-gateway:$V" .
          docker pull -q postgres:18.6
      # The chiseled-extra image must connect to Postgres over Npgsql and resolve a named time zone;
      # the roles refuse to start otherwise, so healthy containers prove both. The first run also
      # proves `orvano install` runs as --user 0:0 in the chiseled image.
      # The master key block shows only when this run generated the key; the result install.sh reads
      # it from is a file it deletes, never a line you see.
      - name: First install
        shell: bash
        run: |
          sudo sh deploy/install/install.sh --version "$V" --domain localhost --yes --no-pull 2>&1 | tee "$RUNNER_TEMP/first.out"
          grep -q 'Back up your master key now' "$RUNNER_TEMP/first.out"
          if grep -q 'generated_master_key' "$RUNNER_TEMP/first.out"; then echo "the result line was shown"; exit 1; fi
          if sudo test -e /opt/orvano/.install-result; then echo ".install-result was left behind"; exit 1; fi
      - name: Caddyfile is valid with and without an ACME email
        run: |
          for email in "" ops@example.com; do
            docker run --rm -e ORVANO_ACME_EMAIL="$email" -e ORVANO_PUBLIC_URL=https://orvano.example.com \
              "ghcr.io/orvanohq/orvano-gateway:$V" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: GET /v1/health through Caddy, and /internal stays closed
        run: |
          curl -fsS http://localhost/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/internal/readyz)" = 404
          test "$(cd /opt/orvano && sudo docker compose exec -T api /app/orvano setup-status)" = required
          # HSTS only on HTTPS installs (spec 0006, AC-26).
          if curl -sI http://localhost/ | grep -qi '^strict-transport-security'; then echo "HSTS sent on http://localhost"; exit 1; fi
      - name: Second install changes no secret
        shell: bash
        run: |
          sudo cp /opt/orvano/.env "$RUNNER_TEMP/env.first"
          sudo sh deploy/install/install.sh --version "$V" --domain localhost --yes --no-pull 2>&1 | tee "$RUNNER_TEMP/second.out"
          if grep -q 'Back up your master key now' "$RUNNER_TEMP/second.out"; then echo "the master key block showed on a rerun"; exit 1; fi
          for key in POSTGRES_PASSWORD ORVANO_ADMIN_PASSWORD ORVANO_APP_PASSWORD ORVANO_MASTER_KEYS ORVANO_SETUP_TOKEN; do
            first=$(sudo grep "^$key=" "$RUNNER_TEMP/env.first")
            second=$(sudo grep "^$key=" /opt/orvano/.env)
            test -n "$first" && test "$first" = "$second" || { echo "$key changed"; exit 1; }
          done
          sudo cmp "$RUNNER_TEMP/env.first" /opt/orvano/.env
      # Spec 0011, AC-1 to AC-4: `install --local` as the runner's own user, beside the server install above.
      - name: Local install as a non root user
        shell: bash
        run: |
          dir="$RUNNER_TEMP/local"
          mkdir -p "$dir"
          docker run --rm --user "$(id -u):$(id -g)" -v "$dir:/install" "ghcr.io/orvanohq/orvano:$V" install --local --yes | tee "$RUNNER_TEMP/local.out"
          grep -q 'docker compose up -d --wait' "$RUNNER_TEMP/local.out"
          grep -q 'http://localhost:7700/setup#ost_' "$RUNNER_TEMP/local.out"
          grep -q 'http://localhost:8025' "$RUNNER_TEMP/local.out"
          grep -q 'Back up your master key now' "$RUNNER_TEMP/local.out"
          test "$(stat -c %U "$dir/.env")" = "$(id -un)"
          test "$(stat -c %a "$dir/.env")" = 600
          cp "$dir/.env" "$RUNNER_TEMP/local.env.first"
          docker run --rm --user "$(id -u):$(id -g)" -v "$dir:/install" "ghcr.io/orvanohq/orvano:$V" install --local --yes >/dev/null
          cmp "$RUNNER_TEMP/local.env.first" "$dir/.env"
      - name: Local stack is healthy, on loopback only, with email out of the box
        shell: bash
        run: |
          cd "$RUNNER_TEMP/local"
          docker compose up -d --wait
          curl -fsS http://localhost:7700/v1/health
          curl -fsS http://localhost:8025/readyz
          published=$(docker compose ps --format json | jq -r '.Publishers[]? | select(.PublishedPort != 0) | "\(.URL):\(.PublishedPort)"' | sort -u | tr '\n' ' ')
          test "$published" = "127.0.0.1:7700 127.0.0.1:8025 " || { echo "published: $published"; exit 1; }
          test "$(docker compose exec -T postgres psql -U postgres -d orvano -tAc "SELECT host || ':' || port FROM orvano.messaging_smtp_settings WHERE project_id = 'console'")" = mailpit:1025
          case "$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env)" in orvano-local-??????) ;; *) echo "bad project name"; exit 1 ;; esac
      - name: A folder never changes kind
        shell: bash
        run: |
          sudo cp /opt/orvano/.env "$RUNNER_TEMP/server.env"
          status=0; docker run --rm --user 0:0 -v /opt/orvano:/install "ghcr.io/orvanohq/orvano:$V" install --local --yes || status=$?
          test "$status" = 2
          sudo cmp "$RUNNER_TEMP/server.env" /opt/orvano/.env
          status=0; sudo sh deploy/install/install.sh --dir "$RUNNER_TEMP/local" --version "$V" --domain localhost --yes --no-pull || status=$?
          test "$status" = 2
          cmp "$RUNNER_TEMP/local.env.first" "$RUNNER_TEMP/local/.env"
      - if: failure()
        run: |
          sudo cat /opt/orvano/install.log || true
          cd /opt/orvano && sudo docker compose ps --all && sudo docker compose logs
          cd "$RUNNER_TEMP/local" 2>/dev/null && docker compose ps --all && docker compose logs || true
      - if: always()
        run: |
          cd /opt/orvano && sudo docker compose down -v || true
          cd "$RUNNER_TEMP/local" 2>/dev/null && docker compose down -v || true

  passed:
    name: CI passed
    if: always()
    needs: [changes, lint, server, console, console-tests, console-e2e, install]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A CI job failed or was cancelled."
          exit 1
      - run: echo "Every CI job passed or was skipped because its area did not change."
