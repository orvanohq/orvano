name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      # Style and analyzer rules from .editorconfig; analyzer errors also fail the server build.
      - run: dotnet format Orvano.slnx --verify-no-changes
      # Type aware lint rules need the types of workspace packages, which live in their dist/.
      - run: pnpm --filter "@orvano/scenarios-nextjs^..." build
      - run: pnpm lint
      - run: pnpm format:check

  server:
    name: Server build, tests, and EF drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Orvano.slnx -c Release
      # Testcontainers starts its own Postgres 18 from deploy/compose/initdb, so this needs only Docker.
      - run: dotnet test --solution Orvano.slnx -c Release --no-build
      - name: Start an empty Postgres 18
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=ci -e ORVANO_ADMIN_PASSWORD=ci-admin -e ORVANO_APP_PASSWORD=ci-app \
            -v "$PWD/deploy/compose/initdb:/docker-entrypoint-initdb.d:ro" \
            postgres:18.6
          for i in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U orvano_admin -d orvano -q && exit 0
            sleep 1
          done
          docker logs pg; exit 1
      - name: EF model drift check
        run: dotnet run --project server/tests/Orvano.ModelDriftCheck -c Release --no-build
        env:
          ORVANO_DB_ADMIN_URL: Host=localhost;Port=5432;Username=orvano_admin;Password=ci-admin;Database=orvano

  console:
    name: JS workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  console-tests:
    name: Console tests (unit and browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      # The console imports the private console client, which builds on the JS runtime.
      - run: pnpm --filter "@orvano/console^..." build
      - run: pnpm --filter @orvano/console exec playwright install --with-deps chromium
      # Contrast, color literal, keyboard script, axe, density, and role tests (spec 0005).
      - run: pnpm --filter @orvano/console test

  console-e2e:
    name: Console end to end (gateway, real API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orvano/console exec playwright install --with-deps chromium
      # The gateway (Caddy plus the console build) in front of the scenario server, on :8081.
      - run: docker compose -f tests/scenarios/compose.yml --profile console up -d --build --wait
      - run: pnpm --filter @orvano/console test:e2e
      - if: failure()
        run: docker compose -f tests/scenarios/compose.yml --profile console logs
      - if: always()
        run: docker compose -f tests/scenarios/compose.yml --profile console down -v

  install:
    # The real install path, twice, on both architectures (spec 0006, AC-30): images built from this
    # commit and tagged from VERSION, then install.sh with --no-pull, as on an air gapped server.
    name: Install with install.sh (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq shellcheck; }
          shellcheck --shell=sh deploy/install/install.sh
      - name: Build the images
        run: |
          V=$(cat VERSION)
          echo "V=$V" >> "$GITHUB_ENV"
          docker build -f deploy/server.Dockerfile -t "ghcr.io/orvanohq/orvano:$V" .
          docker build -f deploy/gateway/Dockerfile -t "ghcr.io/orvanohq/orvano-gateway:$V" .
          docker pull -q postgres:18.6
      # The chiseled-extra image must connect to Postgres over Npgsql and resolve a named time zone;
      # the roles refuse to start otherwise, so healthy containers prove both. The first run also
      # proves `orvano install` runs as --user 0:0 in the chiseled image.
      - name: First install
        run: sudo sh deploy/install/install.sh --version "$V" --domain localhost --yes --no-pull
      - name: GET /v1/health through Caddy, and /internal stays closed
        run: |
          curl -fsS http://localhost/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/internal/readyz)" = 404
      - name: Second install changes no secret
        run: |
          sudo cp /opt/orvano/.env "$RUNNER_TEMP/env.first"
          sudo sh deploy/install/install.sh --version "$V" --domain localhost --yes --no-pull
          for key in POSTGRES_PASSWORD ORVANO_ADMIN_PASSWORD ORVANO_APP_PASSWORD ORVANO_MASTER_KEYS ORVANO_SETUP_TOKEN; do
            first=$(sudo grep "^$key=" "$RUNNER_TEMP/env.first")
            second=$(sudo grep "^$key=" /opt/orvano/.env)
            test -n "$first" && test "$first" = "$second" || { echo "$key changed"; exit 1; }
          done
          sudo cmp "$RUNNER_TEMP/env.first" /opt/orvano/.env
      - if: failure()
        run: |
          sudo cat /opt/orvano/install.log || true
          cd /opt/orvano && sudo docker compose ps --all && sudo docker compose logs
      - if: always()
        run: cd /opt/orvano && sudo docker compose down -v || true
