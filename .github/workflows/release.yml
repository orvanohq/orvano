# Releases the public SDKs (spec 0001, AC-12) and the server (spec 0006, AC-29). Pushing a tag
# `v<VERSION>` runs the whole SDK workflow first (generated code current, AC-3; scenarios on every
# surface, AC-10), then publishes to npm, pub.dev, and NuGet, then updates the read only mirror repos.
# Alongside, it pushes the two images to GHCR for amd64 and arm64 and creates the GitHub Release
# with install.sh (its version stamped in) and install.sh.sha256, marked latest, so
# `releases/latest/download/install.sh` always serves the newest installer.
#
# Last, the docs site (spec 0011, AC-25): once every package and image is out, the `examples` job
# builds the five quickstart apps from the real registries, and only then does `website` build
# orvano.dev from the tag and deploy it.
#
# Until Orvano reaches 0.1 every step is a dry run: packages are packed and validated, mirror
# commits and the site are built, but nothing is uploaded, pushed, or deployed. Running this
# workflow by hand is always a dry run, so the pipeline can be tried from any branch.
#
# Private packages never publish: pnpm skips every package marked `"private": true` (so
# @orvano/console-client never leaves the repo), and only the four named Dart packages and the one
# .NET project are published.
#
# Credentials: OIDC trusted publishing where the registry offers it. The secrets NPM_TOKEN and
# NUGET_API_KEY are only for when it isn't set up (a brand new npm package must be published once
# with a token before trusted publishing can be configured). NUGET_USER (a variable) is the
# nuget.org account the trusted publishing policy belongs to. MIRROR_PUSH_TOKEN may write only to
# the three mirror repos.

name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dry-run: ${{ steps.plan.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match VERSION ($version). Tag v$version instead."
            exit 1
          fi
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          dry=false
          if [ "$GITHUB_EVENT_NAME" != push ] || { [ "$major" -eq 0 ] && [ "$minor" -eq 0 ]; }; then dry=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry-run=$dry" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (dry run: $dry)" >> "$GITHUB_STEP_SUMMARY"

  sdks:
    name: SDKs
    needs: plan
    uses: ./.github/workflows/sdks.yml

  npm:
    name: Publish to npm
    needs: [plan, sdks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.plan.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./sdks/**" build
      # pnpm skips private packages and versions already on the registry, and turns `workspace:*`
      # into the real version. Without NPM_TOKEN it authenticates through OIDC.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          flags="--access public --no-git-checks"
          if [ "$DRY_RUN" = true ]; then flags="$flags --dry-run"; fi
          pnpm --filter "./sdks/**" -r publish $flags

  pub:
    name: Publish to pub.dev
    needs: [plan, sdks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.plan.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # pub.dev automated publishing: exchange the GitHub OIDC token for a pub.dev one. Each package
      # must allow this repo and the tag pattern `v{{version}}` in its pub.dev admin page.
      - name: Sign in to pub.dev
        if: env.DRY_RUN != 'true'
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://pub.dev" | jq -r .value)
          echo "::add-mask::$token"
          echo "PUB_TOKEN=$token" >> "$GITHUB_ENV"
          dart pub token add https://pub.dev --env-var PUB_TOKEN
      # orvano_core first: the other three depend on it. A version already on pub.dev is skipped, as pnpm and NuGet skip
      # theirs, so a rerun after a partial release doesn't fail on what already went out. pub.dev allows GitHub
      # publishing only for a package that exists, so on a real release a package pub.dev doesn't know yet (404) is
      # skipped with a warning, and its first version is uploaded by hand from the tag; any other answer than 200
      # fails the job, so an outage never silently skips a publish. A dry run skips that probe.
      - name: Publish
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          flag=--force
          if [ "$DRY_RUN" = true ]; then flag=--dry-run; fi
          publish() {
            if [ "$DRY_RUN" != true ]; then
              status=$(curl -s -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/$1")
              if [ "$status" = 404 ]; then
                echo "::warning::$1 is not on pub.dev yet, so it was skipped. Upload $VERSION by hand from the tag (cd $2 && $3 pub publish), then allow GitHub publishing for it."
                return
              elif [ "$status" != 200 ]; then
                echo "::error::pub.dev answered $status for $1."
                return 1
              fi
            fi
            if curl -sf -o /dev/null "https://pub.dev/api/packages/$1/versions/$VERSION"; then
              echo "$1 $VERSION is already on pub.dev; skipping it."
            else
              (cd "$2" && $3 pub publish $flag)
            fi
          }
          publish orvano_core sdks/dart/core dart
          publish orvano_flutter_passkeys sdks/dart/flutter_passkeys flutter
          publish orvano_dart sdks/dart/server dart
          publish orvano_flutter sdks/dart/flutter flutter

  nuget:
    name: Publish to NuGet
    needs: [plan, sdks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ needs.plan.outputs.dry-run }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet pack sdks/dotnet/src/Orvano -c Release -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
      - name: Sign in to NuGet (trusted publishing)
        id: login
        if: env.DRY_RUN != 'true' && env.NUGET_API_KEY == ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          KEY: ${{ env.NUGET_API_KEY || steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  images:
    name: Image ${{ matrix.image }}
    needs: [plan, sdks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: orvano
            dockerfile: deploy/server.Dockerfile
          - image: orvano-gateway
            dockerfile: deploy/gateway/Dockerfile
    env:
      DRY_RUN: ${{ needs.plan.outputs.dry-run }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: tags
        run: |
          minor=$(echo "$VERSION" | cut -d. -f1,2)
          {
            echo "tags<<EOF"
            echo "ghcr.io/orvanohq/${{ matrix.image }}:$VERSION"
            echo "ghcr.io/orvanohq/${{ matrix.image }}:$minor"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Both Dockerfiles compile on the build platform, so only the final copy runs emulated.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.DRY_RUN != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/orvanohq/orvano
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          push: ${{ env.DRY_RUN != 'true' }}

  github-release:
    name: GitHub Release with install.sh
    needs: [plan, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ needs.plan.outputs.dry-run }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the version into install.sh
        run: |
          mkdir -p dist
          sed "s/^STAMPED_VERSION=\"\"\$/STAMPED_VERSION=\"$VERSION\"/" deploy/install/install.sh > dist/install.sh
          grep -qx "STAMPED_VERSION=\"$VERSION\"" dist/install.sh || { echo "::error::install.sh has no STAMPED_VERSION line to stamp."; exit 1; }
          sh dist/install.sh --help >/dev/null
          (cd dist && sha256sum install.sh > install.sh.sha256)
          cat dist/install.sh.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: install-sh
          path: dist/
      - name: Create the release
        if: env.DRY_RUN != 'true'
        run: |
          gh release create "v$VERSION" --verify-tag --latest --title "Orvano $VERSION" --generate-notes \
            dist/install.sh dist/install.sh.sha256

  mirrors:
    name: Mirror ${{ matrix.repo }}
    needs: [plan, npm, pub, nuget]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: orvano-js
            paths: sdks/js:js sdks/nextjs:nextjs
          - repo: orvano-dart
            paths: sdks/dart/core:orvano_core sdks/dart/flutter:orvano_flutter sdks/dart/flutter_passkeys:orvano_flutter_passkeys sdks/dart/server:orvano_dart
          - repo: orvano-dotnet
            paths: sdks/dotnet/src/Orvano:src/Orvano Directory.Build.props:Directory.Build.props Directory.Packages.props:Directory.Packages.props global.json:global.json VERSION:VERSION
    env:
      DRY_RUN: ${{ needs.plan.outputs.dry-run }}
      VERSION: ${{ needs.plan.outputs.version }}
      REPO: ${{ matrix.repo }}
      PATHS: ${{ matrix.paths }}
      MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: monorepo
      # The mirror holds exactly the tracked files of each path; everything else is replaced.
      - name: Build the mirror commit
        run: |
          if [ "$DRY_RUN" = true ]; then
            git init -q -b main mirror
          elif [ -z "$MIRROR_PUSH_TOKEN" ]; then
            echo "::error::MIRROR_PUSH_TOKEN is not set, so the mirror can't be updated."
            exit 1
          else
            git clone -q "https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/orvanohq/${REPO}.git" mirror
          fi
          find mirror -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for pair in $PATHS; do
            src="${pair%%:*}"; dest="${pair#*:}"
            (cd monorepo && git ls-files -z -- "$src") | while IFS= read -r -d '' file; do
              target="mirror/$dest${file#"$src"}"
              mkdir -p "$(dirname "$target")"
              cp "monorepo/$file" "$target"
            done
          done
          cp monorepo/LICENSE mirror/LICENSE
          sha=$(git -C monorepo rev-parse HEAD)
          printf '%s\n' \
            "# ${REPO}" "" \
            "A read only mirror of the Orvano SDK packages at v${VERSION}." "" \
            "They are generated and released from [orvanohq/orvano](https://github.com/orvanohq/orvano) (commit \`${sha}\`)." \
            "Please open issues and pull requests there." > mirror/README.md
          cd mirror
          git -c user.name=orvano-release -c user.email=release@orvano.dev add -A
          git -c user.name=orvano-release -c user.email=release@orvano.dev commit -q -m "Release v${VERSION}" -m "From orvanohq/orvano@${sha}"
          git tag "v${VERSION}"
          git show --stat --format='%s%n%b' HEAD
      - name: Push
        if: env.DRY_RUN != 'true'
        working-directory: mirror
        run: git push origin HEAD:main "refs/tags/v${VERSION}"

  # AC-25: before orvano.dev shows this version, all five examples build exactly as a reader gets them, from npm,
  # pub.dev, and NuGet at the released version, each from a copy outside the repo. Only on a real release: a dry run
  # publishes nothing to build from. A registry can take a few minutes to serve a version it just accepted, so each
  # install retries for up to 15 minutes.
  examples:
    name: Examples from the registries
    needs: [plan, npm, pub, nuget]
    if: needs.plan.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: node .github/scripts/check-example-pins.mjs
      - name: Copy the examples
        run: |
          for example in nextjs js dart dotnet flutter; do cp -R "examples/$example-quickstart" "$RUNNER_TEMP/"; done
          cat > "$RUNNER_TEMP/retry.sh" <<'SH'
          retry() {
            for _ in $(seq 1 30); do
              "$@" && return 0
              echo "Not on the registry yet; trying again in 30 seconds."
              sleep 30
            done
            return 1
          }
          SH
      - name: Next.js quickstart
        working-directory: ${{ runner.temp }}/nextjs-quickstart
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry npm install --no-audit --no-fund --prefer-online
          NEXT_PUBLIC_ORVANO_PROJECT=smoke npm run build
      - name: JavaScript quickstart
        working-directory: ${{ runner.temp }}/js-quickstart
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry npm install --no-audit --no-fund --prefer-online
          npm run build
      - name: Dart server quickstart
        working-directory: ${{ runner.temp }}/dart-quickstart
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry dart pub get
          dart analyze --fatal-infos
          dart compile exe bin/server.dart -o "$RUNNER_TEMP/dart-server"
          dart compile exe bin/create_user.dart -o "$RUNNER_TEMP/dart-create-user"
      - name: .NET quickstart
        working-directory: ${{ runner.temp }}/dotnet-quickstart
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry dotnet restore --no-http-cache
          dotnet build -c Release -warnaserror --no-restore
      - name: Flutter quickstart
        working-directory: ${{ runner.temp }}/flutter-quickstart
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry flutter pub get
          flutter analyze --fatal-infos
          flutter build web

  # AC-25: a dry run (and so every manual run) builds the production site from this ref and checks it, then stops.
  website-dry-run:
    name: Build the site (dry run)
    needs: [plan, npm, pub, nuget, images]
    if: needs.plan.outputs.dry-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orvano/website build
        env:
          ORVANO_SITE_ENV: production
      - run: pnpm --filter @orvano/website exec playwright install --with-deps chromium
      - run: pnpm --filter @orvano/website check:site
        env:
          ORVANO_SITE_ENV: production

  # AC-25: orvano.dev changes only here, from the release tag, once every package and image is published and the
  # examples built from the registries. The `website-production` environment holds the Cloudflare token and the beacon
  # token; if it requires a reviewer, this job waits for your approval too.
  website:
    name: Deploy orvano.dev
    needs: [plan, examples, images, github-release]
    if: needs.plan.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    environment: website-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orvano/website build
        env:
          ORVANO_SITE_ENV: production
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      - run: pnpm --filter @orvano/website exec playwright install --with-deps chromium
      - run: pnpm --filter @orvano/website check:site
        env:
          ORVANO_SITE_ENV: production
      - working-directory: website
        run: pnpm exec wrangler deploy --message "Release v${{ needs.plan.outputs.version }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
