# Spec 0008 KIT-1: repo hygiene for the core repo and every SDK repo. SDK repos call it as
# orvanohq/orvano/.github/workflows/repo-hygiene.yml@<full SHA>. The caller grants `contents: read` and
# `pull-requests: read` (the dco job reads the PR's commits, spec 0010 DCO-1); it takes no secrets.
name: Repo hygiene

on:
  workflow_call:
    inputs:
      working-directory:
        description: The folder to check, relative to the repo root.
        type: string
        default: .

permissions: {}

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # GIT-2: Conventional Commits, at most 72 characters (Dependabot titles skip the length check).
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert'
          if [[ "$TITLE" =~ ^Revert\ \".+\"$ ]]; then
            echo "GitHub revert title: ok"
            exit 0
          fi
          if ! [[ "$TITLE" =~ ^($types)(\([a-z0-9]+(-[a-z0-9]+)*\))?!?:\ [^[:space:]].*[^.[:space:]]$ ]]; then
            echo "::error::PR title must look like '<type>(<scope>)!: <summary>' (spec 0008 GIT-2). Types: ${types//|/, }. No trailing period."
            exit 1
          fi
          if [ "$AUTHOR" != "dependabot[bot]" ] && [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters; the limit is 72 (spec 0008 GIT-2)."
            exit 1
          fi
          echo "PR title: ok"

  # Spec 0009 CTB-1 to CTB-3, spec 0010 DCO-1, DCO-2: every commit in the PR is signed off by its author. Runs inside
  # ci-gate. Inline (not a file in tooling/scripts) because an SDK repo's checkout doesn't have the core's scripts;
  # tooling/scripts/dco.test.mjs runs this exact block against a stub API.
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check every commit is signed off
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          # DCO-2: a bot commit is skipped only in a PR a bot opened. A commit's author comes from its email, which
          # anyone can set; the PR author can't be faked.
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          # read -d '' returns 1 at the end of input, hence || true.
          read -r -d '' script <<'JS' || true
          const api = process.env.GITHUB_API_URL || "https://api.github.com";
          const { GH_TOKEN, REPO, PR_NUMBER } = process.env;
          const botPr = process.env.PR_AUTHOR_TYPE === "Bot"; // missing or anything else: a person (fail closed)
          const limit = 250; // the most the PR commits endpoint returns (CTB-3)
          const tooMany = `This PR has more than ${limit} commits, and the dco check can't read them all. Please split this PR.`;

          // Trailers are the last paragraph of the message; the key is case insensitive, the email is inside <...>.
          const signOffs = (message) =>
            message.trim().split(/\r?\n\s*\r?\n/).at(-1).split(/\r?\n/)
              .map((line) => /^signed-off-by:.*<([^<>]+)>\s*$/i.exec(line.trim())?.[1])
              .filter(Boolean)
              .map((email) => email.trim().toLowerCase());

          async function main() {
            if (Number(process.env.COMMIT_COUNT) > limit) return [tooMany];
            const commits = [];
            for (let page = 1; page <= 3; page++) {
              const response = await fetch(`${api}/repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100&page=${page}`, {
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: `Bearer ${GH_TOKEN}`,
                  "x-github-api-version": "2022-11-28",
                },
              });
              if (!response.ok) return [`Listing the PR's commits failed: HTTP ${response.status}.`];
              const batch = await response.json();
              commits.push(...batch);
              if (batch.length < 100) break;
            }
            if (commits.length > limit) return [tooMany];

            const failures = [];
            let checked = 0;
            for (const c of commits) {
              if (c.parents.length > 1) continue; // a merge commit
              // A null author (email not linked to an account) is not a bot.
              const botCommit = c.author?.type === "Bot";
              if (botCommit && botPr) continue;
              checked++;
              const author = (c.commit.author?.email ?? "").toLowerCase();
              const emails = signOffs(c.commit.message);
              if (emails.includes(author)) continue;
              if (botCommit) {
                failures.push(`${c.sha}: authored by a bot (${author}) inside a person's PR, with no matching Signed-off-by. Make yourself its author and sign off (\`git commit --amend --reset-author -s\` for the last commit, or an interactive rebase for an older one), or drop it.`);
              } else if (emails.length === 0) failures.push(`${c.sha}: no Signed-off-by line.`);
              else failures.push(`${c.sha}: no Signed-off-by matches the author email ${author}.`);
            }
            if (failures.length === 0) {
              console.log(`dco: ${checked} commit(s) signed off, ${commits.length - checked} skipped (merge or bot PR).`);
            }
            return failures;
          }

          const failures = await main();
          if (failures.length > 0) {
            for (const failure of failures) console.log(`::error::${failure}`);
            console.log("");
            console.log("Every commit needs a sign off that matches its author email (CONTRIBUTING.md, Sign your work). To fix it:");
            console.log("  git rebase --signoff origin/main");
            console.log("  git push --force-with-lease");
            process.exitCode = 1;
          }
          JS
          node --input-type=module -e "$script"

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      # Fails on findings (no SARIF upload, so it needs no security-events permission).
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          advanced-security: false
          inputs: ${{ inputs.working-directory }}/.github

  text:
    name: text
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          files: ${{ inputs.working-directory }}
      # Markdown, YAML, JSON, and TOML outside console/ (the console job checks its own files).
      # A Vite+ repo uses its own pinned Vite+ and its fmt ignores; other repos use the pinned Oxfmt CLI.
      - id: vite-plus
        name: Detect Vite+
        run: |
          if [ -f package.json ] && grep -q '"vite-plus"' package.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.vite-plus.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version-file: ${{ inputs.working-directory }}/.node-version
          cache: true
      - if: steps.vite-plus.outputs.present == 'true'
        name: Format check (Vite+)
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vp fmt --check '**/*.{md,yml,yaml,json,jsonc,toml}' '!console/**'
      - if: steps.vite-plus.outputs.present != 'true'
        name: Format check (Oxfmt)
        run: npx --yes oxfmt@0.72.0 --check '**/*.{md,yml,yaml,json,jsonc,toml}'
