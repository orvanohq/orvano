# Scratch caller that proves sdk-dart.yml runs under the org's SHA pinning rule. Removed before merge.
name: Scratch SDK (Dart)

on:
  pull_request:

permissions: {}

jobs:
  dart:
    uses: ./.github/workflows/sdk-dart.yml
    permissions:
      contents: read
    with:
      working-directory: scratch-sdk-dart/dart

  flutter:
    uses: ./.github/workflows/sdk-dart.yml
    permissions:
      contents: read
    with:
      working-directory: scratch-sdk-dart/flutter
      flutter: true
