# Spec 0008 KIT-1: the static checks for the Dart and Flutter SDK repos (spec 0004 Enforcement). SDK repos call it as
# orvanohq/orvano/.github/workflows/sdk-dart.yml@<full SHA>. The SDK version comes from the pubspec.yaml
# constraint's floor and the latest stable (DRT-1). The device and platform matrix joins with feature 52.
name: SDK (Dart)

on:
  workflow_call:
    inputs:
      working-directory:
        description: The package folder, relative to the repo root.
        type: string
        default: .
      flutter:
        description: True for the Flutter repo (flutter analyze and flutter test).
        type: boolean
        default: false

permissions: {}

jobs:
  dart:
    name: dart (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sdk: [floor, stable]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: floor
        name: Read the SDK floor from pubspec.yaml (DRT-1)
        run: |
          floor="$(sed -nE 's/^[[:space:]]+sdk:[[:space:]]*\^?([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)"
          echo "version=$floor" >> "$GITHUB_OUTPUT"
      - if: ${{ !inputs.flutter }}
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk == 'floor' && steps.floor.outputs.version || 'stable' }}
      # Not subosito/flutter-action: it calls actions/cache by tag inside itself, which the org's SHA pinning rule
      # refuses when the job starts, even when this step is skipped. The archive is checked against the
      # sha256 in Flutter's own release manifest.
      - if: ${{ inputs.flutter }}
        name: Install the latest stable Flutter
        working-directory: ${{ runner.temp }}
        run: |
          manifest="$(curl -fsSL --retry 3 https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json)"
          base_url="$(jq -er '.base_url' <<< "$manifest")"
          release="$(jq -ec '.current_release.stable as $hash | .releases[] | select(.hash == $hash and .channel == "stable")' <<< "$manifest")"
          archive="$(jq -er '.archive' <<< "$release")"
          echo "Flutter $(jq -er '.version' <<< "$release") (Dart $(jq -er '.dart_sdk_version' <<< "$release"))"
          curl -fsSL --retry 3 -o flutter.tar.xz "$base_url/$archive"
          echo "$(jq -er '.sha256' <<< "$release")  flutter.tar.xz" | sha256sum --check --strict
          tar -xJf flutter.tar.xz
          rm flutter.tar.xz
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Dependencies (lowest versions on the floor, DRT-3)
        env:
          SDK: ${{ matrix.sdk }}
          FLUTTER: ${{ inputs.flutter }}
        run: |
          tool=dart; [ "$FLUTTER" = "true" ] && tool=flutter
          if [ "$SDK" = "floor" ]; then "$tool" pub downgrade; else "$tool" pub get; fi
      - name: Format (DRT-5)
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (DRT-4)
        env:
          FLUTTER: ${{ inputs.flutter }}
        run: if [ "$FLUTTER" = "true" ]; then flutter analyze --fatal-infos; else dart analyze --fatal-infos; fi
      - name: Repo checks (tool/check_*.dart, written with the first Dart repo)
        run: |
          for script in tool/check_imports.dart tool/check_deps.dart tool/check_version.dart; do
            if [ -f "$script" ]; then dart run "$script"; fi
          done
      - name: The package carries LICENSE and NOTICE (spec 0009 LIC-8)
        if: matrix.sdk == 'stable'
        env:
          FLUTTER: ${{ inputs.flutter }}
        run: |
          tool=dart; [ "$FLUTTER" = "true" ] && tool=flutter
          output="$("$tool" pub publish --dry-run 2>&1 || true)"
          status=0
          for file in LICENSE NOTICE; do
            # Only the file tree lines count: pub's own "You must have a LICENSE file" error names the file too.
            if ! printf '%s\n' "$output" | grep -Eq "^[[:space:]]*(├|└)── $file( |$)"; then
              echo "::error::the published package has no $file (spec 0009 LIC-6)"
              status=1
            fi
          done
          exit "$status"
      - name: Tests
        env:
          FLUTTER: ${{ inputs.flutter }}
        run: if [ "$FLUTTER" = "true" ]; then flutter test; else dart test; fi
