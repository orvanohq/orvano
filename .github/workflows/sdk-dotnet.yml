# Spec 0008 KIT-1: the static checks for the .NET SDK repo (spec 0002 Enforcement). SDK repos call it as
# orvanohq/orvano/.github/workflows/sdk-dotnet.yml@<full SHA>. Versions come from the repo's global.json.
# The conformance suite against a real server joins with feature 10 (see spec 0008 Follow-up).
name: SDK (.NET)

on:
  workflow_call:
    inputs:
      working-directory:
        description: The folder holding the solution, relative to the repo root.
        type: string
        default: .

permissions: {}

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Outage workaround for setup-dotnet, the same steps as .github/actions/install-dotnet (read its comment). A
      # reusable workflow can't use this repo's local actions, so they sit inline. Remove once aka.ms works again.
      - name: Install .NET from builds.dotnet.microsoft.com (aka.ms outage workaround)
        working-directory: .
        env:
          GLOBAL_JSON: ${{ inputs.working-directory }}/global.json
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/dotnet-install.sh"
          curl -fsSL --retry 3 -o "$script" \
            https://raw.githubusercontent.com/dotnet/install-scripts/da3ce11ba63f3dbb0fb835d41bda2665d5c48e84/src/dotnet-install.sh
          echo "082f7685e156738a1b2e2ed8381a621870d4ce8e8c59278034556f05c186eb2e  $script" | sha256sum --check --strict
          dir="$RUNNER_TEMP/dotnet"
          bash "$script" --jsonfile "$GLOBAL_JSON" --azure-feed https://builds.dotnet.microsoft.com/dotnet --install-dir "$dir"
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles(format('{0}/**/packages.lock.json', inputs.working-directory)) }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore --locked-mode
      - name: Format check (FMT-3, FMT-6)
        run: dotnet format --verify-no-changes --no-restore
      - name: Build with warnings as errors (analyzers, public API files, NuGetAudit)
        run: dotnet build -c Release -p:CI=true --no-incremental --no-restore
      - name: Unit tests with coverage
        run: dotnet test -c Release --no-build --coverage --coverage-output-format cobertura
      - name: Pack (package shape, LIB-2)
        run: dotnet pack -c Release --no-build -p:CI=true -o "$RUNNER_TEMP/packages"
      - name: Packages carry LICENSE and NOTICE (spec 0009 LIC-8)
        run: |
          status=0
          for pkg in "$RUNNER_TEMP"/packages/*.nupkg; do
            for file in LICENSE NOTICE; do
              if ! unzip -Z1 "$pkg" | grep -qx "$file"; then
                echo "::error::$(basename "$pkg") has no $file at its root (spec 0009 LIC-6)"
                status=1
              fi
            done
          done
          exit "$status"
