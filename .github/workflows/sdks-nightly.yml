# Flutter scenarios on the iOS simulator (spec 0001, AC-13), and the Flutter quickstart on the iOS simulator and the
# Android emulator (spec 0011, AC-20): nightly, on release tags, and on demand, to keep costly macOS and emulator
# minutes off every pull request. macOS runners have no Docker, so Postgres comes from Homebrew, Mailpit from its
# release, and the api and worker roles run from source in the Test environment; the Android job starts a real local
# stack with `install --local`.

name: SDKs nightly

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.2
  # Throwaway passwords for a database that lives only for this job.
  ORVANO_ADMIN_PASSWORD: scenarios-admin
  ORVANO_APP_PASSWORD: scenarios-app

jobs:
  flutter-ios:
    name: Scenarios, Flutter on iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Start Postgres 18
        run: |
          brew install postgresql@18
          PG="$(brew --prefix postgresql@18)/bin"
          echo "$PG" >> "$GITHUB_PATH"
          "$PG/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust
          "$PG/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-p 5432" start
          POSTGRES_USER=postgres PATH="$PG:$PATH" sh deploy/compose/initdb/10-orvano-roles.sh
      # The same Mailpit as tests/scenarios/compose.yml: the fixtures' install SMTP names the host `mailpit`, and the
      # email scenarios read what arrived through its API (spec 0009, spec 0010).
      - name: Start Mailpit
        run: |
          curl -fsSL https://github.com/axllent/mailpit/releases/download/v1.31.3/mailpit-darwin-arm64.tar.gz | tar -xz -C "$RUNNER_TEMP" mailpit
          echo '127.0.0.1 mailpit' | sudo tee -a /etc/hosts
          "$RUNNER_TEMP/mailpit" --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025 > "$RUNNER_TEMP/mailpit.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8025/readyz && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/mailpit.log"; exit 1
      - name: Migrate
        run: dotnet run --project server/src/Orvano.Server -c Release -- migrate
        env:
          ORVANO_DB_ADMIN_URL: Host=localhost;Port=5432;Username=orvano_admin;Password=${{ env.ORVANO_ADMIN_PASSWORD }};Database=orvano
      - name: Start the api role in the Test environment
        run: |
          dotnet run --project server/src/Orvano.Server -c Release --no-build -- api > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/v1/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"; exit 1
        env:
          ASPNETCORE_ENVIRONMENT: Test
          ASPNETCORE_URLS: http://localhost:8080
          ORVANO_DB_URL: Host=localhost;Port=5432;Username=orvano_app;Password=${{ env.ORVANO_APP_PASSWORD }};Database=orvano
          ORVANO_PUBLIC_URL: http://localhost:8080
          ORVANO_MASTER_KEYS: kscenarios:b3J2YW5vLXNjZW5hcmlvcy10ZXN0LW1hc3Rlci1rZXk=
          ORVANO_TEST_FIXTURES: ${{ github.workspace }}/tests/scenarios/fixtures.yaml
          ORVANO_SMTP_ALLOW_PRIVATE_HOSTS: 'true'
          ORVANO_TEST_MAILPIT_URL: http://localhost:8025
          # The fake sign in provider (spec 0012, AC-27), served by this api; as in tests/scenarios/compose.yml.
          ORVANO_TEST_OAUTH_PROVIDER_URL: http://localhost:8080/v1/test/oauth
      # The worker provisions the fixture projects the api seeded; until then every project call is 409
      # project_not_ready. It sends the queued emails to Mailpit too.
      - name: Start the worker role and wait for the fixture projects
        run: |
          dotnet run --project server/src/Orvano.Server -c Release --no-build -- worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          for i in $(seq 1 60); do
            left=$(psql -U postgres -d orvano -tAc "select count(*) from orvano.platform_projects where status <> 'active'")
            [ "$left" = 0 ] && exit 0
            sleep 2
          done
          psql -U postgres -d orvano -c "select id, status from orvano.platform_projects"
          cat "$RUNNER_TEMP/worker.log"; exit 1
        env:
          ASPNETCORE_ENVIRONMENT: Test
          ASPNETCORE_URLS: http://localhost:8081
          ORVANO_DB_URL: Host=localhost;Port=5432;Username=orvano_app;Password=${{ env.ORVANO_APP_PASSWORD }};Database=orvano
          ORVANO_DB_ADMIN_URL: Host=localhost;Port=5432;Username=orvano_admin;Password=${{ env.ORVANO_ADMIN_PASSWORD }};Database=orvano
          ORVANO_MASTER_KEYS: kscenarios:b3J2YW5vLXNjZW5hcmlvcy10ZXN0LW1hc3Rlci1rZXk=
          ORVANO_SMTP_ALLOW_PRIVATE_HOSTS: 'true'
          # Apple's revoke job calls the fake provider too.
          ORVANO_TEST_OAUTH_PROVIDER_URL: http://localhost:8080/v1/test/oauth
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          # bootstatus -b boots it and returns only once it has finished booting; `simctl boot` returns before that.
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      # The app runs in about a minute once built; a run that hangs (it has, after installing the app) fails at the
      # timeout instead of after six hours, and its verbose log shows where it stopped.
      - name: Run the scenarios
        timeout-minutes: 30
        working-directory: tests/scenarios/runners/flutter
        run: |
          dart run tool/copy_scenarios.dart
          flutter test integration_test -d ${{ steps.simulator.outputs.udid }} --dart-define=ORVANO_ENDPOINT=http://localhost:8080 --verbose
      # The quickstart app's own integration test, against this job's stack and its fixture project. Native apps send
      # no Origin, so the project needs no platform for them to call it.
      - name: Flutter quickstart on iOS
        timeout-minutes: 30
        run: |
          cp -R examples/flutter-quickstart "$RUNNER_TEMP/flutter-quickstart"
          node .github/scripts/use-local-sdks.mjs "$RUNNER_TEMP/flutter-quickstart" "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/flutter-quickstart"
          flutter pub get
          flutter test integration_test -d ${{ steps.simulator.outputs.udid }} \
            --dart-define=ORVANO_ENDPOINT=http://localhost:8080 --dart-define=ORVANO_PROJECT=scenarios0000000000a
      - if: failure()
        run: cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/worker.log" "$RUNNER_TEMP/pg.log" || true

  flutter-android-quickstart:
    name: Flutter quickstart on Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orvano/website exec playwright install --with-deps chromium
      - name: Build the images and start a local stack with install --local
        run: |
          V=$(cat VERSION)
          docker build -f deploy/server.Dockerfile -t "ghcr.io/orvanohq/orvano:$V" .
          docker build -f deploy/gateway/Dockerfile -t "ghcr.io/orvanohq/orvano-gateway:$V" .
          mkdir -p "$RUNNER_TEMP/stack"
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/stack:/install" "ghcr.io/orvanohq/orvano:$V" install --local --yes >/dev/null
          cd "$RUNNER_TEMP/stack" && docker compose up -d --wait
      # The quickstart's console steps, including the Android platform `dev.orvano.quickstart`.
      - name: Console journey
        run: pnpm --filter @orvano/website screenshots
        env:
          ORVANO_LOCAL_DIR: ${{ runner.temp }}/stack
          QUICKSTART_ENV: ${{ runner.temp }}/quickstart.env
          SCREENSHOTS: '0'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Copy the example
        run: |
          cp -R examples/flutter-quickstart "$RUNNER_TEMP/flutter-quickstart"
          node .github/scripts/use-local-sdks.mjs "$RUNNER_TEMP/flutter-quickstart" "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/flutter-quickstart" && flutter pub get)
          . "$RUNNER_TEMP/quickstart.env"
          echo "ORVANO_PROJECT=$ORVANO_PROJECT" >> "$GITHUB_ENV"
      # As the quickstart says: adb reverse makes the emulator's localhost:7700 the stack's, never 10.0.2.2.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: ${{ runner.temp }}/flutter-quickstart
          script: |
            adb reverse tcp:7700 tcp:7700
            flutter test integration_test -d emulator-5554 --dart-define=ORVANO_ENDPOINT=http://localhost:7700 --dart-define=ORVANO_PROJECT=${{ env.ORVANO_PROJECT }}
      - if: failure()
        run: cd "$RUNNER_TEMP/stack" && docker compose ps --all && docker compose logs
      - if: always()
        run: cd "$RUNNER_TEMP/stack" && docker compose down -v || true
