# The API contract and SDK pipeline (spec 0001). One job proves the committed contract and generated
# code are current (AC-1, AC-3), one runs the TS and Dart runtime unit tests, one reports breaking
# changes since the last release (AC-15), and the rest run the shared scenarios on every SDK
# surface against a real Orvano started in containers (AC-10, AC-13, AC-16). iOS runs nightly (sdks-nightly.yml). release.yml calls this
# whole workflow and publishes only when it passes (AC-12).

name: SDKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so `dart format` in SdkGen matches every machine (AC-3). Keep in step with .tool-versions.
  FLUTTER_VERSION: 3.44.2

jobs:
  # Which areas this pull request touches (.github/scripts/changed-areas.sh), so each job below runs
  # only when its inputs changed. Pushes to main, release.yml's call, and manual runs run every job.
  # "SDKs passed" at the end is the one check to require on main: it passes when every job either
  # passed or was skipped. A scenario runner runs when its SDK changed or the server under test did.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.areas.outputs.generated }}
      unit: ${{ steps.areas.outputs.unit }}
      breaking: ${{ steps.areas.outputs.breaking }}
      server: ${{ steps.areas.outputs.server }}
      js: ${{ steps.areas.outputs.js }}
      dart: ${{ steps.areas.outputs.dart }}
      flutter: ${{ steps.areas.outputs.flutter }}
      dotnet: ${{ steps.areas.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - id: areas
        run: |
          .github/scripts/changed-areas.sh HEAD^1 HEAD <<'RULES'
          all        .github/workflows/sdks.yml .github/scripts/changed-areas.sh
          # Prose, including the AGENTS.md and CLAUDE.md files inside code folders.
          ignore     *.md
          # Anything SdkGen reads or writes, and the formatters it runs.
          generated  contract/* tools/* sdks/* tests/scenarios/runners/* server/src/Orvano.Contract/* package.json pnpm-lock.yaml pnpm-workspace.yaml .prettierrc.json pubspec.yaml pubspec.lock global.json Directory.Build.props Directory.Packages.props .editorconfig .tool-versions VERSION
          unit       sdks/js/* sdks/nextjs/* sdks/dart/* package.json pnpm-lock.yaml pnpm-workspace.yaml pubspec.yaml pubspec.lock .tool-versions
          breaking   contract/dist/* VERSION
          # The server under test and the shared scenarios every runner plays.
          server     server/* contract/dist/openapi.json deploy/server.Dockerfile deploy/compose/* tests/scenarios/*.yaml tests/scenarios/compose.yml global.json Directory.Build.props Directory.Packages.props .dockerignore VERSION
          js         sdks/js/* sdks/nextjs/* sdks/console-client/* tests/scenarios/runners/js/* tests/scenarios/runners/nextjs/* package.json pnpm-lock.yaml pnpm-workspace.yaml .tool-versions
          dart       sdks/dart/core/* sdks/dart/server/* tests/scenarios/runners/dart/* pubspec.yaml pubspec.lock .tool-versions
          flutter    sdks/dart/* tests/scenarios/runners/flutter/* pubspec.yaml pubspec.lock .tool-versions
          dotnet     sdks/dotnet/* tests/scenarios/runners/dotnet/* global.json Directory.Build.props Directory.Packages.props
          RULES

  generated:
    name: Contract and generated code are current
    needs: changes
    if: needs.changes.outputs.generated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Resolves the pub workspace, which also fixes the Dart language version dart format uses.
      - run: flutter pub get
      - run: pnpm --filter @orvano/contract build
      - name: The compiled contract and its error catalog are committed (AC-1; spec 0011, AC-16)
        run: |
          if [ -n "$(git status --porcelain -- contract)" ]; then
            git diff -- contract
            echo "::error::contract/dist/openapi.json or errors.json is stale. Run 'pnpm --filter @orvano/contract build' and commit it."
            exit 1
          fi
      - run: dotnet run --project tools/sdkgen
      - name: Generated code is committed (AC-3)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated code is stale. Run 'dotnet run --project tools/sdkgen' and commit the result."
            exit 1
          fi
      - name: A second run changes nothing (AC-3)
        run: |
          dotnet run --project tools/sdkgen
          test -z "$(git status --porcelain)"
      - name: No test operation reaches a package, a docs snippet, or the public contract (AC-17, AC-18)
        run: |
          if grep -rElI --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=bin --exclude-dir=obj --exclude-dir=.dart_tool '/v1/(console/)?test/' sdks contract/dist/examples; then
            echo "::error::The files above contain a test only route. x-orvano-test operations belong only in tests/scenarios/runners."
            exit 1
          fi
          if grep -ElI 'x-orvano-test|/v1/console/|"console"' contract/dist/openapi.public.json contract/dist/examples -r; then
            echo "::error::The public contract or a docs snippet contains a test or console operation."
            exit 1
          fi
      - name: No published package depends on @orvano/console-client (AC-17)
        run: |
          pnpm -r ls --json --depth Infinity --prod | node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const reaches = (deps) => Object.entries(deps ?? {}).some(([name, dep]) =>
              name === "@orvano/console-client" || reaches(dep.dependencies))
            const bad = JSON.parse(readFileSync(0, "utf8"))
              .filter((p) => p.private !== true && reaches(p.dependencies))
              .map((p) => p.name)
            if (bad.length > 0) {
              console.log(`::error::${bad.join(", ")} depend on @orvano/console-client, which is never published.`)
              process.exit(1)
            }'
      - name: Analyze the Dart packages
        run: flutter analyze --fatal-infos sdks/dart tests/scenarios/runners/dart tests/scenarios/runners/flutter

  unit:
    name: SDK runtime unit tests
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      # @orvano/nextjs tests import @orvano/js from its dist/.
      - run: pnpm --filter @orvano/js build
      - run: pnpm --filter @orvano/js --filter @orvano/nextjs test
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart test
        working-directory: sdks/dart/core
      - run: dart test
        working-directory: sdks/dart/server
      # The API key guard only exists in a browser build.
      - run: dart test -p chrome
        working-directory: sdks/dart/server
      - run: flutter test
        working-directory: sdks/dart/flutter

  breaking:
    name: Breaking changes since the last release
    needs: changes
    if: needs.changes.outputs.breaking == 'true'
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: 1.32.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the last release
        id: base
        run: |
          # The newest release tag this commit builds on, other than its own version's tag.
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname --merged HEAD | grep -vx "v$(cat VERSION)" | head -n 1 || true)
          if [ -z "$tag" ]; then
            echo "::notice::No earlier release tag yet, so there is nothing to compare against."
          elif ! git cat-file -e "$tag:contract/dist/openapi.public.json" 2>/dev/null; then
            echo "::notice::$tag has no contract/dist/openapi.public.json, so there is nothing to compare against."
            tag=""
          else
            git show "$tag:contract/dist/openapi.public.json" > base.public.json
            git show "$tag:contract/dist/openapi.json" > base.full.json
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install oasdiff
        if: steps.base.outputs.tag != ''
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/checksums.txt" | grep " $archive\$" | sha256sum --check
          tar -xzf "$archive" oasdiff
      # Public operations: a warning before 1.0, a failure from 1.0 on (AC-15).
      - name: Public contract (openapi.public.json)
        if: steps.base.outputs.tag != ''
        env:
          TAG: ${{ steps.base.outputs.tag }}
        run: |
          status=0
          ./oasdiff breaking base.public.json contract/dist/openapi.public.json --format text --fail-on ERR > public.txt || status=$?
          { echo "### Public operations since $TAG"; echo '```'; cat public.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat public.txt
          if [ "$status" -ne 0 ]; then
            if [ "$(cut -d. -f1 VERSION)" -ge 1 ]; then
              echo "::error::Breaking changes to public operations since $TAG. After 1.0 they need a major version."
              exit 1
            fi
            echo "::warning::Breaking changes to public operations since $TAG. Allowed before 1.0; see the job summary."
          fi
      # Every operation, console and test ones included: information only (AC-15, AC-17).
      - name: Full contract (openapi.json)
        if: steps.base.outputs.tag != ''
        env:
          TAG: ${{ steps.base.outputs.tag }}
        run: |
          ./oasdiff breaking base.full.json contract/dist/openapi.json --format text > full.txt
          { echo "### Every operation since $TAG (information only)"; echo '```'; cat full.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat full.txt

  server-image:
    name: Scenario server image
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.dart == 'true' || needs.changes.outputs.flutter == 'true' || needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/server.Dockerfile -t ghcr.io/orvanohq/orvano:dev .
      - run: docker save ghcr.io/orvanohq/orvano:dev | gzip > server-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: server-image.tar.gz
          retention-days: 1

  js:
    name: Scenarios, ${{ matrix.target }}
    needs: [changes, server-image]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [node, bun, deno, browser, workerd, nextjs]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: server-image
      - run: gunzip -c server-image.tar.gz | docker load
      - run: docker compose -f tests/scenarios/compose.yml up -d --no-build --wait --wait-timeout 180
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - run: pnpm install --frozen-lockfile
      - if: matrix.target == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.target == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.target == 'browser'
        run: pnpm --filter @orvano/scenarios-js exec playwright install --with-deps chromium
      - if: matrix.target != 'nextjs'
        run: pnpm --filter "@orvano/scenarios-js..." build
      # The Next.js app and everything it imports: @orvano/js, @orvano/nextjs, the interpreter.
      - if: matrix.target == 'nextjs'
        run: pnpm --filter "@orvano/scenarios-nextjs..." build
      - run: pnpm --filter @orvano/scenarios-js scenarios ${{ matrix.target }}
      - if: failure()
        run: docker compose -f tests/scenarios/compose.yml logs

  dart:
    name: Scenarios, Dart server
    needs: [changes, server-image]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: server-image
      - run: gunzip -c server-image.tar.gz | docker load
      - run: docker compose -f tests/scenarios/compose.yml up -d --no-build --wait --wait-timeout 180
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run bin/run.dart
        working-directory: tests/scenarios/runners/dart
      - if: failure()
        run: docker compose -f tests/scenarios/compose.yml logs

  flutter-web:
    name: Scenarios, Flutter on Chrome
    needs: [changes, server-image]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: server-image
      - run: gunzip -c server-image.tar.gz | docker load
      - run: docker compose -f tests/scenarios/compose.yml up -d --no-build --wait --wait-timeout 180
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: nanasess/setup-chromedriver@v3
      - run: chromedriver --port=4444 &
      - run: flutter pub get
      - name: Run the scenarios
        working-directory: tests/scenarios/runners/flutter
        # The app and the server are on different ports, so Chrome's same origin checks are off.
        run: |
          dart run tool/copy_scenarios.dart
          flutter drive -d web-server --browser-name=chrome \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/scenarios_test.dart \
            --web-browser-flag=--disable-web-security \
            --dart-define=ORVANO_ENDPOINT=http://localhost:8080
      - if: failure()
        run: docker compose -f tests/scenarios/compose.yml logs

  flutter-android:
    name: Scenarios, Flutter on Android
    needs: [changes, server-image]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: server-image
      - run: gunzip -c server-image.tar.gz | docker load
      - run: docker compose -f tests/scenarios/compose.yml up -d --no-build --wait --wait-timeout 180
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/copy_scenarios.dart
        working-directory: tests/scenarios/runners/flutter
      # adb reverse maps the emulator's localhost:8080 to the host's, so the endpoint matches the server's
      # ORVANO_PUBLIC_URL and access tokens verify against their issuer.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: tests/scenarios/runners/flutter
          script: |
            adb reverse tcp:8080 tcp:8080
            flutter test integration_test -d emulator-5554 --dart-define=ORVANO_ENDPOINT=http://localhost:8080
      - if: failure()
        run: docker compose -f tests/scenarios/compose.yml logs

  dotnet:
    name: Scenarios, .NET
    needs: [changes, server-image]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: server-image
      - run: gunzip -c server-image.tar.gz | docker load
      - run: docker compose -f tests/scenarios/compose.yml up -d --no-build --wait --wait-timeout 180
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: net10.0
        run: dotnet run --project tests/scenarios/runners/dotnet -f net10.0
      # net8.0 has no net10.0 asset to pick, so it loads the SDK's netstandard2.0 build.
      - name: netstandard2.0 (through net8.0)
        run: dotnet run --project tests/scenarios/runners/dotnet -f net8.0
      - if: failure()
        run: docker compose -f tests/scenarios/compose.yml logs

  passed:
    name: SDKs passed
    if: always()
    needs:
      [
        changes,
        generated,
        unit,
        breaking,
        server-image,
        js,
        dart,
        flutter-web,
        flutter-android,
        dotnet,
      ]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::An SDK job failed or was cancelled."
          exit 1
      - run: echo "Every SDK job passed or was skipped because its area did not change."
