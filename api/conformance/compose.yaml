# Spec 0014 CNF-6: the servers an SDK's conformance suite runs against. It mirrors the reference install
# (deploy/compose.yaml, spec 0007 INS-1) with test only values. From an SDK repo, after fetching orvano into .orvano/:
#   ORVANO_IMAGE_TAG=sha-<pinned commit> docker compose -f .orvano/api/conformance/compose.yaml up -d --wait
# Orvano answers on http://localhost:18080, the stub on http://localhost:18081. Podman works the same.
# To try a local build instead of the published image: ORVANO_IMAGE=orvano ORVANO_IMAGE_TAG=ci (from the _deploy job's
# `docker buildx build -t orvano:ci`).
name: orvano-conformance

x-orvano: &orvano
  image: ${ORVANO_IMAGE:-ghcr.io/orvanohq/orvano}:${ORVANO_IMAGE_TAG:?set ORVANO_IMAGE_TAG to sha-<orvano commit>}
  environment: &orvano-environment
    ORVANO_DATABASE__HOST: postgres
    ORVANO_DATABASE__USERNAME: orvano
    # Fixed throwaway test passwords: this database lives only for one test run (spec 0006 SCR-5).
    ORVANO_DATABASE__PASSWORD: conformance-owner
    ORVANO_PROJECTDB__ADMINUSERNAME: orvano_provisioner
    ORVANO_PROJECTDB__ADMINPASSWORD: conformance-provisioner
    ORVANO_PUBLIC_URL: http://localhost:18080

services:
  postgres:
    image: postgres:18.6 # spec 0007 PG-1: the same exact tag as deploy/compose.yaml
    environment:
      POSTGRES_PASSWORD: conformance-postgres
      ORVANO_DB_PASSWORD: conformance-owner
      ORVANO_PROVISIONER_PASSWORD: conformance-provisioner
    command: ["postgres", "-c", "max_connections=300"]
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ../../deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d orvano"]
      interval: 2s
      timeout: 3s
      retries: 60

  # A fresh root key for every run: 32 random bytes, base64, the form `orvano init` writes.
  root-key:
    image: node:24.22.1-alpine3.24 # the stub's image, so a run pulls one Node image
    command:
      - node
      - -e
      - >-
        require("node:fs").writeFileSync("/keys/root.key",
        require("node:crypto").randomBytes(32).toString("base64") + "\n", { mode: 0o644 })
    volumes:
      - root-key:/keys

  migrate:
    <<: *orvano
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  orvano:
    <<: *orvano
    environment:
      <<: *orvano-environment
      ORVANO_ROLES: api,worker
      ORVANO_ROOT_KEY_FILE: /keys/root.key
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - root-key:/keys:ro
    healthcheck:
      test: ["CMD", "/app/orvano", "healthcheck"] # spec 0007 IMG-4
      interval: 2s
      timeout: 6s
      retries: 60
    depends_on:
      migrate:
        condition: service_completed_successfully
      root-key:
        condition: service_completed_successfully

  stub:
    image: node:24.22.1-alpine3.24 # spec 0014 STB-1: Node 24, pinned like the other compose images
    command: ["node", "/stub/server.mjs"]
    environment:
      STUB_PORT: "18081"
    ports:
      - "127.0.0.1:18081:18081"
    volumes:
      - ./stub:/stub:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:18081/__stub/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  root-key:
