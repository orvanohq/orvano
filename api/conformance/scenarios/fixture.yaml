# Spec 0014 STB-4: behavior proven on the stub only fixture service (fixture.openapi.json) until real endpoints exist.
scenarios:
  - id: fixture.create_widget.no_retry_without_key
    title: A marked POST is not retried after a 503 without an idempotency key (IDM-3)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.createWidget
        params: { name: first }
        expect:
          error: { kind: server, status: 503, code: unavailable }
    stub:
      - request: { method: POST, path: "/v1/projects/${projectId}/fixture/widgets" }
        respond:
          status: 503
          headers: { Content-Type: application/problem+json }
          body:
            {
              type: "about:blank",
              title: Service Unavailable,
              status: 503,
              detail: Not ready.,
              code: unavailable,
              traceId: 0af7651916cd43dd8448eb211c80319c,
            }
    expectRequests:
      - method: POST
        path: "/v1/projects/${projectId}/fixture/widgets"
        headers:
          { content-type: { $regex: "^application/json" }, idempotency-key: { $absent: true } }
        body: { name: first }

  - id: fixture.create_widget.retry_with_key
    title: A marked POST with an idempotency key is retried after a 503, sending the same key (IDM-1, IDM-3)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.createWidget
        params: { name: first }
        options: { idempotencyKey: order-7 }
        expect:
          result: { id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10, name: first }
    stub:
      - request: { method: POST, path: "/v1/projects/${projectId}/fixture/widgets" }
        respond:
          status: 503
          headers: { Content-Type: application/problem+json, Retry-After: "0" }
          body:
            {
              type: "about:blank",
              title: Service Unavailable,
              status: 503,
              detail: Not ready.,
              code: unavailable,
              traceId: 0af7651916cd43dd8448eb211c80319c,
            }
      - request: { method: POST, path: "/v1/projects/${projectId}/fixture/widgets" }
        respond:
          status: 201
          body:
            {
              id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10,
              name: first,
              color: red,
              createdAt: "2026-10-22T09:14:03Z",
            }
    expectRequests:
      - method: POST
        path: "/v1/projects/${projectId}/fixture/widgets"
        headers: { idempotency-key: order-7 }
        body: { name: first }
      - method: POST
        path: "/v1/projects/${projectId}/fixture/widgets"
        headers: { idempotency-key: order-7 }
        body: { name: first }

  - id: fixture.create_widget.field_errors
    title: Field errors are read from a validation problem body (PRB-3)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.createWidget
        params: { name: "", color: red }
        expect:
          error:
            kind: validation
            status: 400
            code: validation_failed
            fieldErrors:
              - {
                  field: name,
                  location: body,
                  code: too_short,
                  message: Name must have at least 1 character.,
                }
    stub:
      - request: { method: POST, path: "/v1/projects/${projectId}/fixture/widgets" }
        respond:
          status: 400
          headers: { Content-Type: application/problem+json }
          body:
            type: "about:blank"
            title: Bad Request
            status: 400
            detail: The request is not valid.
            code: validation_failed
            traceId: 0af7651916cd43dd8448eb211c80319c
            errors:
              - {
                  field: name,
                  location: body,
                  code: too_short,
                  message: Name must have at least 1 character.,
                }
    expectRequests:
      - method: POST
        path: "/v1/projects/${projectId}/fixture/widgets"
        body: { name: "", color: red }

  - id: fixture.get_widget.unknown_enum
    title: An enum value the SDK does not know is kept, not refused (JSW-2, TYP-4)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.getWidget
        params: { widgetId: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10 }
        expect:
          result:
            id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10
            color: purple
            createdAt: { $timestamp: true }
    stub:
      - request:
          {
            method: GET,
            path: "/v1/projects/${projectId}/fixture/widgets/0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10",
          }
        respond:
          status: 200
          body:
            {
              id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10,
              name: first,
              color: purple,
              createdAt: "2026-10-22T09:14:03.120558Z",
            }
    expectRequests:
      - {
          method: GET,
          path: "/v1/projects/${projectId}/fixture/widgets/0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10",
        }

  - id: fixture.list_widgets.one_page
    title: A list call sends limit and cursor and reads one page (PAG-1, PAG-2)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.listWidgets
        params: { limit: 2, cursor: c1 }
        expect:
          result:
            items:
              - { id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a13, name: third, color: red }
              - { id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a14, name: fourth, color: blue }
            nextCursor: c2
            total: null
    stub:
      - request: { method: GET, path: "/v1/projects/${projectId}/fixture/widgets" }
        respond:
          status: 200
          body:
            items:
              - {
                  id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a13,
                  name: third,
                  color: red,
                  createdAt: "2026-10-22T09:14:03Z",
                }
              - {
                  id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a14,
                  name: fourth,
                  color: blue,
                  createdAt: "2026-10-22T09:14:04Z",
                }
            nextCursor: c2
            total: null
    expectRequests:
      - method: GET
        path: "/v1/projects/${projectId}/fixture/widgets"
        query: { limit: ["2"], cursor: [c1] }

  - id: fixture.list_widgets.all_pages
    title: listAll walks three pages and yields every item, passing each nextCursor on (PAG-6, SHP-5)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.listWidgets
        params: { limit: 2 }
        options: { all: true }
        expect:
          result:
            - { name: first }
            - { name: second }
            - { name: third }
            - { name: fourth }
            - { name: fifth }
    stub: &three_pages
      - request: { method: GET, path: "/v1/projects/${projectId}/fixture/widgets" }
        respond:
          status: 200
          body:
            items:
              - {
                  id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a11,
                  name: first,
                  color: red,
                  createdAt: "2026-10-22T09:14:01Z",
                }
              - {
                  id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a12,
                  name: second,
                  color: red,
                  createdAt: "2026-10-22T09:14:02Z",
                }
            nextCursor: c2
            total: null
      - request: { method: GET, path: "/v1/projects/${projectId}/fixture/widgets" }
        respond:
          status: 200
          body:
            items:
              - {
                  id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a13,
                  name: third,
                  color: red,
                  createdAt: "2026-10-22T09:14:03Z",
                }
              - {
                  id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a14,
                  name: fourth,
                  color: blue,
                  createdAt: "2026-10-22T09:14:04Z",
                }
            nextCursor: c3
            total: null
      - request: { method: GET, path: "/v1/projects/${projectId}/fixture/widgets" }
        respond:
          status: 200
          body:
            items:
              - {
                  id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a15,
                  name: fifth,
                  color: blue,
                  createdAt: "2026-10-22T09:14:05Z",
                }
            nextCursor: null
            total: null
    expectRequests:
      - { method: GET, path: "/v1/projects/${projectId}/fixture/widgets", query: { limit: ["2"] } }
      - {
          method: GET,
          path: "/v1/projects/${projectId}/fixture/widgets",
          query: { limit: ["2"], cursor: [c2] },
        }
      - {
          method: GET,
          path: "/v1/projects/${projectId}/fixture/widgets",
          query: { limit: ["2"], cursor: [c3] },
        }

  - id: fixture.list_widgets.all_cancelled
    title: listAll stops fetching pages once the caller cancels (PAG-6, SHP-5, CLN-4)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.listWidgets
        params: { limit: 2 }
        options: { all: true, cancelAfter: 2 }
        expect:
          result:
            - { name: first }
            - { name: second }
    stub: *three_pages
    expectRequests:
      - { method: GET, path: "/v1/projects/${projectId}/fixture/widgets", query: { limit: ["2"] } }

  - id: fixture.update_widget.clears_with_null
    title: A partial update sends null for a cleared field and omits the unset ones (JSW-9, JSW-10)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.updateWidget
        params: { widgetId: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10, nickname: null }
        expect:
          result: { id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10, name: first }
    stub: &updated_widget
      - request:
          {
            method: PATCH,
            path: "/v1/projects/${projectId}/fixture/widgets/0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10",
          }
        respond:
          status: 200
          headers: { ETag: '"AAAAAAAAAAI"' }
          body:
            {
              id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10,
              name: first,
              color: red,
              createdAt: "2026-10-22T09:14:03Z",
            }
    expectRequests:
      - method: PATCH
        path: "/v1/projects/${projectId}/fixture/widgets/0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10"
        headers: { content-type: { $regex: "^application/json" }, if-match: { $absent: true } }
        body: { nickname: null, name: { $absent: true }, tags: { $absent: true } }

  - id: fixture.update_widget.sets_fields
    title: A partial update sends the fields set, arrays whole, and leaves the rest out (JSW-9, JSW-10)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.updateWidget
        params: { widgetId: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10, name: second, tags: [a, b] }
        expect:
          result: { id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10 }
    stub: *updated_widget
    expectRequests:
      - method: PATCH
        path: "/v1/projects/${projectId}/fixture/widgets/0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10"
        body: { name: second, tags: [a, b], nickname: { $absent: true } }

  - id: fixture.update_widget.if_match
    title: The ifMatch option is sent as a strong If-Match (CNC-4)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.updateWidget
        params: { widgetId: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10, name: second }
        options: { ifMatch: AAAAAAAAAAE }
        expect:
          result: { id: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10 }
    stub: *updated_widget
    expectRequests:
      - method: PATCH
        path: "/v1/projects/${projectId}/fixture/widgets/0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10"
        headers: { if-match: '"AAAAAAAAAAE"' }
        body: { name: second }

  - id: fixture.update_widget.version_conflict
    title: A 412 version_conflict reads as kind conflict, and the write is not retried (CNC-3, KND-2)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.updateWidget
        params: { widgetId: 0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10, name: second }
        options: { ifMatch: AAAAAAAAAAE }
        expect:
          error: { kind: conflict, status: 412, code: version_conflict }
    stub:
      - request:
          {
            method: PATCH,
            path: "/v1/projects/${projectId}/fixture/widgets/0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10",
          }
        respond:
          status: 412
          headers: { Content-Type: application/problem+json }
          body:
            {
              type: "about:blank",
              title: Precondition Failed,
              status: 412,
              detail: The resource changed since you read it.,
              code: version_conflict,
              traceId: 0af7651916cd43dd8448eb211c80319c,
              currentVersion: AAAAAAAAAAI,
            }
    expectRequests:
      - method: PATCH
        path: "/v1/projects/${projectId}/fixture/widgets/0192f0c1-7b9e-7c43-9a51-3f0e8d2b6a10"
        headers: { if-match: '"AAAAAAAAAAE"' }

  - id: fixture.delete_label.refuses_dot_segments
    title: An empty or dot segment path value is refused before any request (ERR-T5, EXC-4, LIB-6, PTH-4)
    mode: stub
    audience: [client, server]
    requires: []
    steps:
      - call: fixture.deleteLabel
        params: { labelName: "" }
        expect:
          error: { kind: argument }
      - call: fixture.deleteLabel
        params: { labelName: "." }
        expect:
          error: { kind: argument }
      - call: fixture.deleteLabel
        params: { labelName: ".." }
        expect:
          error: { kind: argument }
      - call: fixture.deleteLabel
        params: { labelName: "%2E%2e" }
        expect:
          error: { kind: argument }
    stub: []
    expectRequests: []
