# Spec 0017 SDK-3: a real key proves itself against the real server, in every SDK. The runner gets the project and its
# keys from `orvano admin bootstrap-project` (CNF-7, SDK-4) and opens the client with the key of its audience.
scenarios:
  - id: keys.current.client
    title: A publishable key answers its project, its type, and its client scopes (SDK-1)
    mode: live
    audience: [client]
    requires: [project]
    steps:
      - call: keys.current
        expect:
          result:
            projectId: ${projectId}
            type: publishable
            scopes: { $contains: [client.auth, client.databases] }

  - id: keys.current.server
    title: A secret key answers its project, its type, and its scopes (SDK-1)
    mode: live
    audience: [server]
    requires: [project]
    steps:
      - call: keys.current
        expect:
          result:
            projectId: ${projectId}
            type: secret
            scopes: { $contains: [databases.read, storage.read] }

  - id: keys.current.bad_key
    title: A key the server does not know answers 401, on a project that exists (AKY-9)
    mode: live
    audience: [client, server]
    requires: [project]
    client: { key: not-a-real-key }
    steps:
      - call: keys.current
        options: { retry: 0 }
        expect:
          error: { kind: unauthenticated, status: 401, code: unauthorized }
