# Spec 0004 DRT-4: the Dart SDK repos' analyzer config (sdk-template-dart), so CI proves the generated Dart passes
# it (spec 0014 AC-14). Keep it equal to the template's analysis_options.yaml.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - public_member_api_docs
    - comment_references
    - unawaited_futures
    - discarded_futures
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - avoid_catches_without_on_clauses
    - avoid_print
    - always_declare_return_types
    - type_annotate_public_apis
    - prefer_final_fields
    - prefer_const_constructors
    - use_super_parameters
    - directives_ordering
    # dart.dev lists this one in lowercase; confirm the casing when the first Dart repo is created (DRT-4).
    - no_runtimeType_toString
    - cast_nullable_to_non_nullable
    - invalid_runtime_check_with_js_interop_types
    - deprecated_member_use_from_same_package
    - implementation_imports
