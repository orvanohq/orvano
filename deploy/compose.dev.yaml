# Local development (spec 0007 DEV-1). Works with Docker Compose v2 and `podman compose`.
#   docker compose -f deploy/compose.dev.yaml up -d
#   docker compose -f deploy/compose.dev.yaml --profile otel up -d     (adds the OpenTelemetry dashboard)
# The server and console run directly on your machine; see README.md.
name: orvano-dev

services:
  postgres:
    image: postgres:18.6 # spec 0007 PG-1: the same exact tag as compose.yaml and Testcontainers
    environment:
      POSTGRES_USER: orvano
      POSTGRES_DB: orvano
      # Development only: no password, and the port is bound to this machine alone.
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U orvano -d orvano"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-dashboard:
    profiles: ["otel"]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888" # dashboard UI
      - "127.0.0.1:4317:18889" # OTLP gRPC: set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317

volumes:
  postgres18-data:
