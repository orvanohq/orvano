# Orvano on one Linux host (spec 0002, containers on one server). Only the gateway publishes
# ports; Postgres and every role stay on the internal network.
#
# Managed by the Orvano installer (spec 0006): every install run rewrites this file from the image
# of the version it installs, so your edits here are lost. Put your changes in
# docker-compose.override.yml next to it instead; the installer never touches that file, and Compose
# merges it. Override a service's keys there, not the `x-` anchors below (anchors are resolved
# before the files merge).
#
# From a checkout of the repo, build the images locally and run the production shape with
#   cd deploy/compose && docker compose -f docker-compose.yml -f docker-compose.build.yml up --build

name: orvano

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-server: &server
  image: ${ORVANO_IMAGE:-ghcr.io/orvanohq/orvano}:${ORVANO_VERSION:-dev}
  restart: unless-stopped
  logging: *logging

x-app-db: &app-db
  ORVANO_DB_URL: Host=postgres;Port=5432;Username=orvano_app;Password=${ORVANO_APP_PASSWORD:?set in .env};Database=orvano

x-healthcheck: &healthcheck
  test: ["CMD", "/app/orvano", "healthcheck"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-after-migrate: &after-migrate
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      ORVANO_ADMIN_PASSWORD: ${ORVANO_ADMIN_PASSWORD:?set in .env}
      ORVANO_APP_PASSWORD: ${ORVANO_APP_PASSWORD:?set in .env}
    # The installer sizes these from the server's memory (spec 0006, Postgres tuning); the fallbacks
    # are spec 0002's values for a 4 GB server.
    command:
      - postgres
      - -c
      - shared_buffers=${ORVANO_PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${ORVANO_PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${ORVANO_PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${ORVANO_PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=100
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - orvano-pg:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, so it stays unhealthy while the socket only bootstrap server runs the init script.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orvano_app", "-d", "orvano"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${ORVANO_PG_MEMORY_LIMIT:-1280M}

  migrate:
    <<: *server
    restart: "no"
    environment:
      ORVANO_ROLE: migrate
      ORVANO_DB_ADMIN_URL: Host=postgres;Port=5432;Username=orvano_admin;Password=${ORVANO_ADMIN_PASSWORD:?set in .env};Database=orvano
      OTEL_SERVICE_NAME: orvano-migrate
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    <<: *server
    environment:
      <<: *app-db
      ORVANO_ROLE: api
      ORVANO_PUBLIC_URL: ${ORVANO_PUBLIC_URL:?set in .env}
      ORVANO_MASTER_KEYS: ${ORVANO_MASTER_KEYS:?set in .env}
      # Only the holder of the installer's setup link can create the first admin (spec 0006).
      ORVANO_SETUP_TOKEN: ${ORVANO_SETUP_TOKEN:-}
      ORVANO_DELETE_GRACE_DAYS: ${ORVANO_DELETE_GRACE_DAYS:-7}
      ORVANO_TRUSTED_PROXIES: ${ORVANO_TRUSTED_PROXIES:-private}
      OTEL_SERVICE_NAME: orvano-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - orvano-storage:/var/lib/orvano/storage
    healthcheck: *healthcheck
    depends_on: *after-migrate
    deploy:
      resources:
        limits:
          memory: 384M

  worker:
    <<: *server
    environment:
      <<: *app-db
      ORVANO_ROLE: worker
      ORVANO_DB_ADMIN_URL: Host=postgres;Port=5432;Username=orvano_admin;Password=${ORVANO_ADMIN_PASSWORD:?set in .env};Database=orvano
      ORVANO_PUBLIC_URL: ${ORVANO_PUBLIC_URL:?set in .env}
      ORVANO_MASTER_KEYS: ${ORVANO_MASTER_KEYS:?set in .env}
      ORVANO_EVENT_RETENTION_DAYS: ${ORVANO_EVENT_RETENTION_DAYS:-7}
      ORVANO_DELETE_GRACE_DAYS: ${ORVANO_DELETE_GRACE_DAYS:-7}
      OTEL_SERVICE_NAME: orvano-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - orvano-storage:/var/lib/orvano/storage
    healthcheck: *healthcheck
    depends_on: *after-migrate
    deploy:
      resources:
        limits:
          memory: 384M

  realtime:
    <<: *server
    environment:
      <<: *app-db
      ORVANO_ROLE: realtime
      OTEL_SERVICE_NAME: orvano-realtime
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck: *healthcheck
    depends_on: *after-migrate
    deploy:
      resources:
        limits:
          memory: 256M

  gateway:
    image: ${ORVANO_GATEWAY_IMAGE:-ghcr.io/orvanohq/orvano-gateway}:${ORVANO_VERSION:-dev}
    restart: unless-stopped
    logging: *logging
    environment:
      ORVANO_PUBLIC_URL: ${ORVANO_PUBLIC_URL:?set in .env}
      ORVANO_ACME_EMAIL: ${ORVANO_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Keeps certificates across recreation (avoids Let's Encrypt rate limits).
      - orvano-caddy:/data
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  orvano-pg:
  orvano-storage:
  orvano-caddy:
