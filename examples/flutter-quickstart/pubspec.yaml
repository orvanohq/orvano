# The finished app of the Orvano Flutter quickstart: https://orvano.dev/docs/quickstarts/flutter/
name: flutter_quickstart
description: Sign up, sign in, see your name and email, and sign out, with orvano_flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

# #region dependencies
dependencies:
  flutter:
    sdk: flutter
  orvano_flutter: 0.0.0
# #endregion dependencies

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
