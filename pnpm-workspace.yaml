# The root pnpm workspace (spec 0008 TL-1). One lockfile, at the root.
# tooling/starters/** holds template files for SDK repos and is never a workspace package (KIT-2).
packages:
  - console
  - api/generator
  - "!tooling/starters/**"

# Spec 0003 SEC-5, spec 0006 SUP-6:
# Dependency install scripts stay blocked (pnpm's default); allow one only by name here, with a reason.
allowBuilds:
  # Denied: @scarf/scarf (through @stoplight/spectral-cli, spec 0014 CLT-1) only sends install analytics.
  "@scarf/scarf": false
# A just published version waits 3 days before it can be installed.
minimumReleaseAge: 4320

# pnpm audit (spec 0006 SUP-5) ignores an advisory only here, with the reason and when to remove it.
auditConfig:
  ignoreGhsas:
    # braces: stack exhaustion on deeply nested patterns. Reached only through @lingui/cli (a build tool; nothing
    # ships in the console bundle), and no patched release exists (2026-10-17). Remove when one ships. Expires
    # 2026-11-16 (spec 0006 SUP-5: at most 30 days); check again then and renew or remove.
    - GHSA-vfj7-8cjw-p6xm
    # minimatch: denial of service through glob part amplification. Reached only through dev tools (ESLint and others
    # that glob the repo's own files; `pnpm audit --prod` is clean, and nothing ships in the console bundle). The
    # advisory, published 2026-10-30, patches only 11.0.1, and ESLint's tree needs the 3.x, 5.x, and 10.x lines, so no
    # override fits (2026-10-30). Remove when those packages take a patched minimatch. Expires 2026-11-29 (spec 0006
    # SUP-5: at most 30 days); check again then and renew or remove.
    - GHSA-g3hv-75wg-m249

# Forced transitive versions, each with the reason and when to remove it.
overrides:
  # seroval (through @tanstack/router-core and @tanstack/router-plugin): GHSA-f86p-h4j2-7qgj (patched in 1.6.11) and
  # GHSA-9wx9-5pv9-3349 (patched in 1.6.10). Every TanStack Router release still accepts seroval ^1.6.7 (2026-10-28).
  # Remove once router-core requires seroval >=1.6.11. seroval-plugins moves with seroval, and ~ keeps both on the
  # 1.6 line that router-core is tested on.
  seroval: ~1.6.11
  seroval-plugins: ~1.6.11
