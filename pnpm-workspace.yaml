packages:
  - contract
  - sdks/js
  - sdks/nextjs
  - sdks/console-client
  - console
  - tests/scenarios/runners/js
  - tests/scenarios/runners/nextjs
  - website

# Dependency build scripts pnpm may run. lefthook's postinstall installs the git hooks (skipped in CI);
# esbuild and workerd (the scenario runners' bundler and edge runtime) check their native binaries;
# sharp is the website's image optimizer.
allowBuilds:
  esbuild: true
  sharp: true
  lefthook: true
  workerd: true
