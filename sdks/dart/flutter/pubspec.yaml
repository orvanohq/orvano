name: orvano_flutter
description: >-
  Orvano for Flutter apps on iOS, Android, and the web, built on orvano_core.
  Orvano is the open source backend you host yourself.
version: 0.0.0
homepage: https://orvano.dev
repository: https://github.com/orvanohq/orvano-dart

resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  orvano_core: ^0.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
