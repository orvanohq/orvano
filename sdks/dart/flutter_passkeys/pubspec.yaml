name: orvano_flutter_passkeys
description: >-
  Native passkeys for Orvano Flutter apps on iOS, macOS, Android, and the web.
  An opt in add on to orvano_flutter, built on the passkeys package.
version: 0.2.0
homepage: https://orvano.dev
repository: https://github.com/orvanohq/orvano-dart

resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  orvano_core: ^0.2.0
  passkeys: ^2.23.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  passkeys_platform_interface: ^2.10.0
