# Spec 0012, AC-8, AC-9, AC-20, AC-24, AC-27: native Google and Apple sign in with ID tokens from
# the fake provider and the SDK's nonce; a token works once.
name: native Google and Apple ID tokens sign in once each
requires: []
steps:
  - op: createNonce
    as: client
    input: {}
    expect: { status: 200 }
    save:
      raw: $.raw
      hashed: $.hashed
  - op: test.createIdToken
    as: client
    input:
      body:
        {
          provider: google,
          aud: scenarios-google-ios,
          sub: 'n-${unique}',
          email: 'n-${unique}@example.com',
          emailVerified: true,
          nonce: '${hashed}',
        }
    expect: { status: 200 }
    save:
      googleToken: $.idToken
  - op: account.createIdTokenSession
    as: client
    input:
      body: { provider: google, idToken: '${googleToken}', nonce: '${raw}' }
    expect:
      status: 201
      body: { isNewUser: true, user: { email: 'n-${unique}@example.com', providers: [google] } }
  - op: account.createIdTokenSession
    as: client
    input:
      body: { provider: google, idToken: '${googleToken}', nonce: '${raw}' }
    expect: { status: 401, code: invalid_id_token }
  - op: test.createIdToken
    as: client
    input:
      body: { provider: apple, aud: dev.orvano.scenarios, sub: 'na-${unique}', nonce: '${hashed}' }
    expect: { status: 200 }
    save:
      appleToken: $.idToken
      appleCode: $.authorizationCode
  - op: account.createIdTokenSession
    as: client
    input:
      body: { provider: apple, idToken: '${appleToken}', nonce: '${raw}' }
    expect: { status: 400, code: invalid_request }
  - op: account.createIdTokenSession
    as: client
    input:
      body:
        {
          provider: apple,
          idToken: '${appleToken}',
          nonce: '${raw}',
          authorizationCode: '${appleCode}',
          name: Grace Hopper,
        }
    expect:
      status: 201
      body: { isNewUser: true, user: { email: null, name: Grace Hopper, providers: [apple] } }
