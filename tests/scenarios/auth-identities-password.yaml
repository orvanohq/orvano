# Spec 0013, AC-17 (with spec 0012, AC-13): a user with a password links a provider only with that password, however
# fresh the session. Without it, or with a wrong one, the native link and the link flow are refused with
# invalid_credentials; with it, Apple links natively and GitHub by redirect.
name: a user with a password links providers only with their current password
requires: []
steps:
  - op: account.create
    as: client
    input:
      body:
        email: 'lp-${unique}@example.com'
        password: correct horse battery staple
        verificationRedirectUrl: 'http://localhost:3000/auth/callback'
    expect: { status: 201 }
  - op: createNonce
    as: client
    input: {}
    expect: { status: 200 }
    save:
      raw: $.raw
      hashed: $.hashed
  - op: test.createIdToken
    as: client
    input:
      body: { provider: apple, aud: dev.orvano.scenarios, sub: 'lpa-${unique}', nonce: '${hashed}' }
    expect: { status: 200 }
    save:
      appleToken: $.idToken
      appleCode: $.authorizationCode
  - op: account.createIdTokenIdentity
    as: client
    input:
      body:
        {
          provider: apple,
          idToken: '${appleToken}',
          nonce: '${raw}',
          authorizationCode: '${appleCode}',
        }
    expect: { status: 401, code: invalid_credentials }
  - op: account.createIdTokenIdentity
    as: client
    input:
      body:
        {
          provider: apple,
          idToken: '${appleToken}',
          nonce: '${raw}',
          authorizationCode: '${appleCode}',
          password: not my password at all,
        }
    expect: { status: 401, code: invalid_credentials }
  - op: account.createIdTokenIdentity
    as: client
    input:
      body:
        {
          provider: apple,
          idToken: '${appleToken}',
          nonce: '${raw}',
          authorizationCode: '${appleCode}',
          password: correct horse battery staple,
        }
    expect: { status: 201, body: { provider: apple } }
  - op: oauthSignIn
    as: client
    input:
      provider: github
      link: true
      testUser: { sub: '7${unique}', email: 'lpg-${unique}@example.com', emailVerified: true }
    expect: { status: 401, code: invalid_credentials }
  - op: oauthSignIn
    as: client
    input:
      provider: github
      link: true
      password: correct horse battery staple
      testUser: { sub: '7${unique}', email: 'lpg-${unique}@example.com', emailVerified: true }
    expect:
      status: 200
      body: { type: oauth_link, identity: { provider: github, email: 'lpg-${unique}@example.com' } }
