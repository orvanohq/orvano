# Spec 0013, AC-6, AC-10, AC-13 to AC-15, AC-18, AC-19, AC-36 to AC-38: with TOTP on, a magic link stops at the MFA
# step too, and a recovery code finishes it through the SDK's completeMfa. A step up with another recovery code then
# allows new codes and turning MFA off.
name: a magic link needs a second factor, and a step up turns MFA off
requires: []
steps:
  - op: now
    as: client
    input: {}
    expect: { status: 200 }
    save:
      beforeSignUp: $.now
  - op: account.create
    as: client
    input:
      body:
        email: 'mfa-all-${unique}@example.com'
        password: correct horse battery staple
        verificationRedirectUrl: 'http://localhost:3000/auth/callback'
    expect: { status: 201 }
  - op: test.getLatestEmail
    as: client
    input: { to: 'mfa-all-${unique}@example.com', after: '${beforeSignUp}' }
    expect:
      status: 200
      body: { type: verification }
    save:
      verifyLink: $.url
  - op: redeemLink
    as: client
    input: { url: '${verifyLink}' }
    expect:
      status: 200
      body: { type: verification, user: { emailVerified: true } }
  - op: account.createTotp
    as: client
    input:
      body: { password: correct horse battery staple }
    expect: { status: 201 }
    save:
      secret: $.secret
  - op: totpCode
    as: client
    input: { secret: '${secret}', offset: 0 }
    expect: { status: 200 }
    save:
      firstCode: $.code
  - op: confirmTotp
    as: client
    input: { code: '${firstCode}' }
    expect:
      status: 200
      body: { refreshTokenKept: true }
    save:
      codeA: $.recoveryCodes.0
      codeB: $.recoveryCodes.1
  - op: account.deleteCurrentSession
    as: client
    input: {}
    expect: { status: 204 }
  - op: now
    as: client
    input: {}
    expect: { status: 200 }
    save:
      beforeLink: $.now
  - op: account.createMagicLink
    as: client
    input:
      body:
        email: 'mfa-all-${unique}@example.com'
        redirectUrl: 'http://localhost:3000/auth/callback'
    expect: { status: 202 }
  - op: test.getLatestEmail
    as: client
    input: { to: 'mfa-all-${unique}@example.com', after: '${beforeLink}' }
    expect:
      status: 200
      body: { type: magic_link }
    save:
      magicLink: $.url
  - op: redeemLink
    as: client
    input: { url: '${magicLink}' }
    expect:
      status: 200
      body: { type: magic_link, user: null, mfaRequired: true, factors: [totp, recovery_code] }
  - op: completeMfa
    as: client
    input: { recoveryCode: '${codeA}' }
    expect:
      status: 201
      body: { user: { email: 'mfa-all-${unique}@example.com' }, mfaRequired: false }
  - op: account.getMfa
    as: client
    input: {}
    expect:
      status: 200
      body: { mfaEnabled: true, recoveryCodesRemaining: 9 }
  - op: verifyMfa
    as: client
    input: { recoveryCode: '${codeB}' }
    expect:
      status: 200
      body: { verified: true, refreshTokenKept: true }
  - op: account.createRecoveryCodes
    as: client
    input: {}
    expect: { status: 201 }
  - op: account.deleteTotp
    as: client
    input: {}
    expect: { status: 204 }
  - op: account.getMfa
    as: client
    input: {}
    expect:
      status: 200
      body: { mfaEnabled: false, totpConfirmed: false, recoveryCodesRemaining: 0 }
  - op: account.createRecoveryCodes
    as: client
    input: {}
    expect: { status: 409, code: mfa_not_enabled }
