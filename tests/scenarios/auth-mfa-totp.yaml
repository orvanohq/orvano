# Spec 0013, AC-5 to AC-9, AC-12, AC-13, AC-16, AC-25, AC-26: a user with a verified email turns on an
# authenticator app (the runner computes its codes from the secret), then a password sign in stops at the MFA step
# with no tokens, and a TOTP code finishes it at level 2 through the SDK's completeMfa (AC-36 to AC-38).
name: a user turns on TOTP, and password sign in then needs a code
requires: []
steps:
  - op: now
    as: client
    input: {}
    expect: { status: 200 }
    save:
      beforeSignUp: $.now
  - op: account.create
    as: client
    input:
      body:
        email: 'mfa-${unique}@example.com'
        password: correct horse battery staple
        verificationRedirectUrl: 'http://localhost:3000/auth/callback'
    expect:
      status: 201
      body: { verificationEmail: queued, mfa: null }
  - op: test.getLatestEmail
    as: client
    input: { to: 'mfa-${unique}@example.com', after: '${beforeSignUp}' }
    expect:
      status: 200
      body: { type: verification }
    save:
      link: $.url
  - op: redeemLink
    as: client
    input: { url: '${link}' }
    expect:
      status: 200
      body: { type: verification, user: { emailVerified: true } }
  - op: account.getMfa
    as: client
    input: {}
    expect:
      status: 200
      body: { mfaEnabled: false, totpConfirmed: false, factorsAvailable: [totp] }
  - op: account.createTotp
    as: client
    input: {}
    expect: { status: 201 }
    save:
      secret: $.secret
  - op: totpCode
    as: client
    input: { secret: '${secret}', offset: 0 }
    expect: { status: 200 }
    save:
      firstCode: $.code
  - op: account.confirmTotp
    as: client
    input:
      body: { code: '${firstCode}' }
    expect: { status: 200 }
  - op: account.getMfa
    as: client
    input: {}
    expect:
      status: 200
      body: { mfaEnabled: true, totpConfirmed: true, recoveryCodesRemaining: 10 }
  - op: account.deleteCurrentSession
    as: client
    input: {}
    expect: { status: 204 }
  - op: account.createPasswordSession
    as: client
    input:
      body: { email: 'mfa-${unique}@example.com', password: correct horse battery staple }
    expect:
      status: 201
      body: { user: null, session: null, mfa: { factors: [totp, recovery_code] } }
  - op: completeMfa
    as: client
    input: { recoveryCode: 'AAAAA-AAAAA' }
    expect: { status: 401, code: invalid_mfa_code }
  - op: totpCode
    as: client
    input: { secret: '${secret}', offset: 1 }
    expect: { status: 200 }
    save:
      nextCode: $.code
  - op: completeMfa
    as: client
    input: { totpCode: '${nextCode}' }
    expect:
      status: 201
      body: { user: { email: 'mfa-${unique}@example.com' }, mfaRequired: false }
  - op: account.listSessions
    as: client
    input: {}
    expect:
      status: 200
      body:
        items: [{ current: true, method: password, aal: 2, amr: [mfa, otp, pwd] }]
