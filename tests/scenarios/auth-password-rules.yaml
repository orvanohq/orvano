# Spec 0014, AC-4 to AC-6, AC-36: the fixture project's rules (fixtures.yaml, authPolicies) refuse a new password that
# is shorter than 12 characters, on the common list, or breached by the api's fake range API, at sign up and from a
# server's users.create, each with its own typed code, and accept one that meets them all.
name: new passwords meet the project's password rules
requires: []
steps:
  - op: account.create
    as: client
    input:
      body: { email: 'pw-short-${unique}@example.com', password: eleven char }
    expect: { status: 400, code: invalid_password }
  - op: account.create
    as: client
    input:
      body: { email: 'pw-common-${unique}@example.com', password: password1234 }
    expect: { status: 400, code: password_too_common }
  - op: account.create
    as: client
    input:
      body: { email: 'pw-breached-${unique}@example.com', password: breached horse battery staple }
    expect: { status: 400, code: password_breached }
  - op: users.create
    as: server
    input:
      body: { email: 'pw-server-${unique}@example.com', password: Password1234 }
    expect: { status: 400, code: password_too_common }
  - op: account.create
    as: client
    input:
      body: { email: 'pw-ok-${unique}@example.com', password: twelve chars ok }
    expect: { status: 201 }
