# Spec 0014, AC-27, AC-36: in a project that requires MFA (fixtures.yaml, scenarios0000000000b), sign up waits for a
# verified email, and the verified user's password sign in then answers no tokens, only an enrollment challenge
# listing the factors to enroll. The client SDK's enrollment helpers spend its ticket: an authenticator app's first
# code turns MFA on and answers the session at level 2 with 10 recovery codes, the user's only session.
name: a project that requires MFA enrolls a user's first factor before any session
project: scenarios0000000000b
requires: []
steps:
  - op: now
    as: client
    input: {}
    expect: { status: 200 }
    save:
      beforeSignUp: $.now
  - op: account.create
    as: client
    input:
      body:
        email: 'req-${unique}@example.com'
        password: correct horse battery staple
        verificationRedirectUrl: 'http://localhost:3000/auth/callback'
    expect:
      status: 201
      body: { verificationRequired: true, session: null, user: null }
  - op: test.getLatestEmail
    as: client
    input: { to: 'req-${unique}@example.com', after: '${beforeSignUp}' }
    expect:
      status: 200
      body: { type: verification }
    save:
      link: $.url
  - op: redeemLink
    as: client
    input: { url: '${link}' }
    expect:
      status: 200
      body: { type: verification }
  - op: account.createPasswordSession
    as: client
    input:
      body: { email: 'req-${unique}@example.com', password: correct horse battery staple }
    expect:
      status: 201
      body:
        session: null
        verificationRequired: false
        mfa: { enrollmentRequired: true, factors: [totp, passkey] }
  - op: startTotpEnrollment
    as: client
    input: {}
    expect: { status: 201 }
    save:
      secret: $.secret
  - op: totpCode
    as: client
    input: { secret: '${secret}' }
    expect: { status: 200 }
    save:
      code: $.code
  - op: completeTotpEnrollment
    as: client
    input: { code: '${code}' }
    expect:
      status: 201
      body: { user: { email: 'req-${unique}@example.com', emailVerified: true } }
  - op: account.listSessions
    as: client
    input: {}
    expect:
      status: 200
      body:
        items: [{ current: true, method: password, aal: 2, amr: [mfa, otp, pwd] }]
