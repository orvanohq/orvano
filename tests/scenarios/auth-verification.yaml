# Spec 0010, AC-11 to AC-14, AC-24, AC-27: verification at sign up, read from Mailpit and redeemed
# through the client SDK's link helper while signed in, then a refused resend.
name: a user verifies their email from the sign up link, and a resend after that is refused
requires: []
steps:
  - op: now
    as: client
    input: {}
    expect: { status: 200 }
    save:
      beforeSignUp: $.now
  - op: account.create
    as: client
    input:
      body:
        email: 'vic-${unique}@example.com'
        password: correct horse battery staple
        verificationRedirectUrl: 'http://localhost:3000/auth/callback'
    expect:
      status: 201
      body: { verificationEmail: queued, isNewUser: true, user: { emailVerified: false } }
  - op: test.getLatestEmail
    as: client
    input: { to: 'vic-${unique}@example.com', after: '${beforeSignUp}' }
    expect:
      status: 200
      body: { type: verification }
    save:
      token: $.token
      link: $.url
  - op: redeemLink
    as: client
    input: { url: '${link}' }
    expect:
      status: 200
      body: { type: verification, isNewUser: false, user: { emailVerified: true } }
  - op: account.get
    as: client
    input: {}
    expect:
      status: 200
      body: { emailVerified: true }
  - op: account.verifyEmail
    as: client
    input:
      body: { token: '${token}' }
    expect: { status: 401, code: invalid_email_token }
  - op: account.createVerification
    as: client
    input:
      body: { redirectUrl: 'http://localhost:3000/auth/callback' }
    expect: { status: 409, code: email_already_verified }
