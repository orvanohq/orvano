name: a user signs up, reads their account, and signs in again
requires: []
steps:
  - op: account.create
    as: client
    input:
      body:
        { email: 'ada-${unique}@example.com', password: correct horse battery staple, name: Ada }
    expect:
      status: 201
      body:
        user:
          { email: 'ada-${unique}@example.com', name: Ada, status: active, emailVerified: false }
    save:
      userId: $.user.id
  - op: account.get
    as: client
    input: {}
    expect:
      status: 200
      body: { id: '${userId}', email: 'ada-${unique}@example.com', name: Ada }
  - op: account.createPasswordSession
    as: client
    input:
      body: { email: 'ADA-${unique}@example.com', password: correct horse battery staple }
    expect:
      status: 201
      body:
        user: { id: '${userId}' }
  - op: account.get
    as: client
    input: {}
    expect:
      status: 200
      body: { id: '${userId}' }
