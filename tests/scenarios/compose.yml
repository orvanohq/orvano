# A real Orvano for the shared scenarios (spec 0001, AC-10): Postgres, migrate, the api role in the
# Test environment, where every response is checked against the contract, and a worker, which
# provisions the fixture projects (spec 0003) and sends queued emails to Mailpit (spec 0009), whose
# API is on http://localhost:8025. The api listens on
# http://localhost:8080. It builds the same image as deploy/compose, so the server under test is
# the one that ships. The passwords are throwaway test values.
#   docker compose -f tests/scenarios/compose.yml up -d --build --wait

name: orvano-scenarios

x-server: &server
  image: ${ORVANO_IMAGE:-ghcr.io/orvanohq/orvano}:${ORVANO_VERSION:-dev}
  build:
    context: ../..
    dockerfile: deploy/server.Dockerfile

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: scenarios
      ORVANO_ADMIN_PASSWORD: scenarios-admin
      ORVANO_APP_PASSWORD: scenarios-app
    volumes:
      - ../../deploy/compose/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'orvano_app', '-d', 'orvano']
      interval: 2s
      timeout: 5s
      retries: 30

  # A mail catcher (spec 0009, AC-29): the fixtures point the install's SMTP at it, and tests read
  # what arrived through its API on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - 127.0.0.1:8025:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *server
    restart: 'no'
    environment:
      ORVANO_ROLE: migrate
      ORVANO_DB_ADMIN_URL: Host=postgres;Port=5432;Username=orvano_admin;Password=scenarios-admin;Database=orvano
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    environment:
      ORVANO_ROLE: api
      ORVANO_DB_URL: Host=postgres;Port=5432;Username=orvano_app;Password=scenarios-app;Database=orvano
      ORVANO_PUBLIC_URL: http://localhost:8080
      # A throwaway master key; secrets in this database are test values only.
      ORVANO_MASTER_KEYS: kscenarios:b3J2YW5vLXNjZW5hcmlvcy10ZXN0LW1hc3Rlci1rZXk=
      ASPNETCORE_ENVIRONMENT: Test
      ORVANO_TEST_FIXTURES: /fixtures/fixtures.yaml
      # A throwaway token, so the first console sign up behaves as on an installed server (spec 0006).
      ORVANO_SETUP_TOKEN: ost_scenarios-setup-token-000000000000000000000
      # Mailpit is on the compose network, a private address.
      ORVANO_SMTP_ALLOW_PRIVATE_HOSTS: 'true'
      # test.getLatestEmail reads the emails the scenarios trigger from Mailpit's API (spec 0010).
      ORVANO_TEST_MAILPIT_URL: http://mailpit:8025
      # Every sign in provider is the api's own fake (spec 0012): the api calls itself on 8080, and
      # runners reach the same address through the published port.
      ORVANO_TEST_OAUTH_PROVIDER_URL: http://localhost:8080/v1/test/oauth
    volumes:
      - ./fixtures.yaml:/fixtures/fixtures.yaml:ro
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: ['CMD', '/app/orvano', 'healthcheck']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  worker:
    <<: *server
    environment:
      ORVANO_ROLE: worker
      ORVANO_DB_URL: Host=postgres;Port=5432;Username=orvano_app;Password=scenarios-app;Database=orvano
      ORVANO_DB_ADMIN_URL: Host=postgres;Port=5432;Username=orvano_admin;Password=scenarios-admin;Database=orvano
      ORVANO_MASTER_KEYS: kscenarios:b3J2YW5vLXNjZW5hcmlvcy10ZXN0LW1hc3Rlci1rZXk=
      ORVANO_SMTP_ALLOW_PRIVATE_HOSTS: 'true'
      ASPNETCORE_ENVIRONMENT: Test
      # Apple revoke jobs (spec 0012, AC-15) go to the api's fake too, never to the real Apple, so
      # test.listAppleRevocations sees them. The worker reaches the api by its service name.
      ORVANO_TEST_OAUTH_PROVIDER_URL: http://api:8080/v1/test/oauth
    healthcheck:
      test: ['CMD', '/app/orvano', 'healthcheck']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The console end to end tests (spec 0005): the gateway image (Caddy plus the console build) in
  # front of the api above, at http://localhost:8081. Only `--profile console` starts it, so the
  # scenario SDK jobs never build or run it.
  #   docker compose -f tests/scenarios/compose.yml --profile console up -d --build --wait
  gateway:
    profiles: [console]
    image: orvano-gateway:scenarios
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
    environment:
      ORVANO_PUBLIC_URL: http://localhost:8081
    ports:
      - 127.0.0.1:8081:8081
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8081/theme-init.js']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
