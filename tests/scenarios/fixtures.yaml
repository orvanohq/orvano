# Seed data for the shared scenarios, loaded by a server started with
# ORVANO_TEST_FIXTURES=<path to this file> in the Test environment (spec 0001, spec 0003, spec 0004).
# consoleUsers: console accounts with known passwords, signed up through the console's own path;
#   the first is the install admin and owns the `Fixtures` org. The JS runner signs the first in
#   for `as: console` steps, and the console's end to end tests sign in as it.
# projects: seeded in the first console account's `Fixtures` org, then provisioned by the worker.
#   Runners send the first as X-Orvano-Project.
# apiKeys: known secrets (orv_sk_ plus 43 base64url characters) for the fixture projects. Server
#   steps send the first.
# platforms: a web platform lets browsers of that host call the project (the browser runners serve
#   their pages from localhost or 127.0.0.1).
# users: app users with known passwords, hashed at load like any sign up.
# installSmtp: the install's SMTP server (spec 0009), the `mailpit` service of compose.yml, so invite
#   emails arrive there and tests read them from http://localhost:8025.
# oauthProviders: all four sign in providers (spec 0012), saved through the console's settings code. In
#   Test, ORVANO_TEST_OAUTH_PROVIDER_URL points them at the api's own fake provider, which accepts any
#   client ID and secret. The Apple key is a throwaway made for these scenarios only.
consoleUsers:
  - email: fixture-admin@example.com
    password: fixture console password
    name: Fixture Admin
projects:
  - id: scenarios0000000000a
    name: Scenarios
apiKeys:
  - project: scenarios0000000000a
    secret: orv_sk_scenarioScenarioScenarioScenarioScenario000
    scopes: [users.read, users.write]
platforms:
  - project: scenarios0000000000a
    type: web
    identifier: localhost
  - project: scenarios0000000000a
    type: web
    identifier: 127.0.0.1
users:
  - project: scenarios0000000000a
    email: fixture-user@example.com
    password: fixture horse battery staple
    name: Fixture User
installSmtp:
  host: mailpit
  port: 1025
  security: none
  fromEmail: orvano@scenarios.test
oauthProviders:
  - project: scenarios0000000000a
    provider: google
    enabled: true
    clientId: scenarios-google-web
    clientSecret: scenarios-google-secret
    clientIdsExtra: [scenarios-google-ios]
  - project: scenarios0000000000a
    provider: apple
    enabled: true
    clientId: dev.orvano.scenarios.web
    clientIdsExtra: [dev.orvano.scenarios]
    appleTeamId: SCENARIOS1
    appleKeyId: SCENARIOKY
    applePrivateKey: |
      -----BEGIN PRIVATE KEY-----
      MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg7h8OMosJFfkuDZUw
      uypojpDZR8j94JL8++F84SXKmkqhRANCAASj9wKnLhJvcOx0l5eonieys8K0DKhy
      gL94OCq2BNXGvQqVSPln9CgpoQc0KRMmWCJsrVzsiOG0tIPdF/9WTisT
      -----END PRIVATE KEY-----
  - project: scenarios0000000000a
    provider: github
    enabled: true
    clientId: scenarios-github
    clientSecret: scenarios-github-secret
  - project: scenarios0000000000a
    provider: microsoft
    enabled: true
    clientId: scenarios-microsoft
    clientSecret: scenarios-microsoft-secret
