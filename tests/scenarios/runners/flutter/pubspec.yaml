name: orvano_scenarios_flutter
description: Runs the shared Orvano scenarios through orvano_flutter on iOS, Android, and the web (spec 0001).
publish_to: none
version: 0.0.0
resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  orvano_core: ^0.0.0
  orvano_dart: ^0.0.0
  orvano_flutter: ^0.0.0
  orvano_scenarios: ^0.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  # Copied from tests/scenarios by `tool/copy_scenarios.dart` before a run (not committed).
  assets:
    - assets/scenarios/
