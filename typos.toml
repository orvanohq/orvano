# Spec 0008 FMT-2: typos skips what Oxfmt and Oxlint skip (tooling/config/ignore-patterns.ts), plus the lockfiles'
# hashes. Add a real word the checker doesn't know under [default.extend-words].
[files]
extend-exclude = [
  "pnpm-lock.yaml",
  "packages.lock.json",
  "console/src/routeTree.gen.ts",
  "schema.gen.ts",
  "api/openapi.json",
  "api/console.openapi.json",
  "server/tests/Orvano.Host.IntegrationTests/Contract/Snapshots/",
  "api/generator/test/snapshots/ts-client/",
  "api/conformance/scenarios.json",
  "api/generator/test/snapshots/ts-server/",
  "api/generator/test/snapshots/dart-client/",
  "api/generator/test/snapshots/dart-server/",
  "api/generator/test/snapshots/csharp-server/",
  "console/src/locales/",
  "server/src/Orvano.Modules.Auth/Passwords/CommonPasswords.txt",
  "dist/",
  "console/dist-size-probe/",
  "bin/",
  "obj/",
  ".vitest/",
  ".tanstack/",
  "coverage/",
  "docs/.agent-cache/",
  "tooling/starters/",
  "CODE_OF_CONDUCT.md",
  ".claude/skills/",
  ".agents/skills/",
  "skills-lock.json",
]

[default]
# Commit SHAs (7 to 40 hex characters) aren't words: the history rewrite gave one the short SHA `ede31c4`, which read
# as a misspelling of "edge" (spec 0010 HIS-2).
extend-ignore-identifiers-re = ["^[0-9a-f]{7,40}$"]

[default.extend-words]
# Rule ID prefix from spec 0005 (SIZ-1, SIZ-2).
SIZ = "SIZ"
# Rule ID prefix from spec 0015 (THM-1 to THM-6, the theme rules).
THM = "THM"
# The wrk HTTP benchmark tool.
wrk = "wrk"
# A valid spelling, used in spec 0004.
unparseable = "unparseable"
